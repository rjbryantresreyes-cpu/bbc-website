<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1A2E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>BBC Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1A2E;--bg2:#14253E;--bg3:#0A1422;--ink:#F5F1EA;--muted:#9FB0C7;
    --gold:#D4AF37;--gold2:#C9A961;--goldB:#B8923E;--green:#4ADE80;
    --line:rgba(212,175,55,0.18);
    --display:'Playfair Display',Georgia,serif;--ui:'DM Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
    --navh:64px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:var(--ui);background:radial-gradient(130% 80% at 70% 0%,#1A2E47 0%,#0E1A2E 50%,#08111E 100%);background-attachment:fixed;color:var(--ink);min-height:100dvh;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom));}

  /* HEADER */
  .hdr{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;background:rgba(14,26,46,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .hdr .b{font-family:var(--display);font-size:19px;font-weight:700;}
  .hdr .b small{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--gold2);display:block;margin-top:1px;}
  .hdr .date{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;}

  .view{padding:18px 20px 28px;max-width:1320px;margin:0 auto;}
  .view.hidden{display:none;}
  h2.vt{font-family:var(--display);font-size:24px;font-weight:700;margin-bottom:4px;}
  .vsub{font-size:13px;color:var(--muted);margin-bottom:18px;}
  .sec{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--gold2);text-transform:uppercase;margin:22px 0 10px;}

  /* STAT GRID */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .stat .n{font-family:var(--display);font-size:30px;font-weight:700;line-height:1;}
  .stat .n.green{color:var(--green);}.stat .n.gold{color:var(--gold);}
  .stat .l{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-top:7px;}

  /* CARD */
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .1s;}
  .card:active{transform:scale(0.99);}
  .card:hover{border-color:var(--gold);}
  .card .row1{display:flex;align-items:center;gap:11px;}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;}
  .av{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:16px;color:#0A1422;}
  .card .nm{font-size:16px;font-weight:600;flex:1;min-width:0;}
  .card .meta{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5;}
  .pill{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.5px;padding:3px 8px;border-radius:999px;text-transform:uppercase;}
  .p-active{background:rgba(74,222,128,0.15);color:var(--green);}
  .p-dev{background:rgba(212,175,55,0.15);color:var(--gold);}
  .p-concept{background:rgba(159,176,199,0.15);color:var(--muted);}
  .mini{display:flex;gap:4px;}
  .pip{width:9px;height:9px;border-radius:3px;background:#1F2937;border:1px solid #3a4658;}
  .pip.on{background:var(--green);border-color:var(--green);}

  /* SEARCH */
  .search{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:11px;color:var(--ink);font-family:var(--ui);font-size:15px;padding:13px 14px;margin-bottom:14px;}
  .search:focus{outline:none;border-color:var(--gold);}

  /* DETAIL SHEET */
  .sheet{position:fixed;inset:0;z-index:60;background:rgba(8,17,30,0.55);backdrop-filter:blur(3px);display:none;}
  .sheet.open{display:block;}
  .sheet-inner{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;background:var(--bg);border-top:2px solid var(--gold);border-radius:20px 20px 0 0;padding:10px 18px calc(28px + env(safe-area-inset-bottom));}
  .grab{width:44px;height:5px;border-radius:3px;background:#3a4658;margin:8px auto 14px;}
  .sheet h3{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.15;margin-bottom:6px;}
  .sheet .row1{display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--muted);font-size:13px;}
  .bar{height:9px;background:var(--bg3);border:1px solid #3a4658;border-radius:5px;overflow:hidden;margin:8px 0;}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--goldB),var(--gold));}
  .arts{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
  .art{text-align:center;padding:11px 4px;border:1px solid var(--line);border-radius:10px;}
  .art.on{border-color:var(--green);background:rgba(74,222,128,0.08);}
  .art .ic{font-size:17px;}.art .nm{font-family:var(--mono);font-size:8px;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin-top:6px;}
  .art.on .nm{color:var(--green);}
  .kv{font-size:14px;line-height:1.6;margin-bottom:5px;}.kv b{color:var(--ink);}.kv span{color:var(--muted);}
  .angle{font-size:15px;font-style:italic;line-height:1.55;}
  .lnk{display:block;font-size:13px;color:var(--gold2);text-decoration:none;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;word-break:break-all;}
  .lnk:hover{border-color:var(--gold);color:var(--gold);}

  /* BOTTOM NAV */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--navh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:rgba(10,20,34,0.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);}
  .nav button{flex:1;background:none;border:none;color:var(--muted);font-family:var(--ui);font-size:9px;font-weight:600;white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding-top:8px;}
  .nav button .i{font-size:19px;line-height:1;}
  .nav button.active{color:var(--gold);}

  /* CALENDAR */
  .cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px 8px;}
  .cal-week{display:grid;grid-template-columns:repeat(7,minmax(132px,1fr));gap:7px;min-width:780px;}
  .cal-day{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:158px;display:flex;flex-direction:column;}
  .cal-day.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .cal-dh{border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:8px;position:relative;}
  .cal-dh .dow{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--gold2);text-transform:uppercase;display:block;}
  .cal-dh .dnum{font-family:var(--display);font-size:17px;font-weight:700;color:var(--ink);}
  .cal-dh .todaytag{position:absolute;top:-1px;right:0;font-family:var(--mono);font-size:8px;background:var(--gold);color:#0A1422;padding:2px 6px;border-radius:999px;letter-spacing:.5px;}
  .cal-ev{display:flex;flex-direction:column;gap:6px;}
  .ev{font-size:11.5px;line-height:1.3;padding:7px 8px;border-radius:8px;border-left:3px solid;}
  .ev-g{background:rgba(45,212,191,0.12);border-color:#2DD4BF;color:#cdeee9;}
  .ev-r{background:rgba(167,139,250,0.12);border-color:#A78BFA;color:#e2d9fb;}
  .ev.done{background:rgba(74,222,128,0.12);border-color:var(--green);color:#cdeecd;}
  .ev-none{background:transparent;border-color:#3a4658;color:var(--muted);text-align:center;}
  .cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted);}
  .cal-legend span{display:flex;align-items:center;gap:6px;}
  .cal-legend .lg{width:13px;height:13px;border-radius:3px;border-left:3px solid;}
  .cal-legend .ev-g{background:rgba(45,212,191,0.2);border-color:#2DD4BF;}
  .cal-legend .ev-r{background:rgba(167,139,250,0.2);border-color:#A78BFA;}
  .cal-legend .done{background:rgba(74,222,128,0.2);border-color:var(--green);}
  .cal-legend .pend{background:rgba(212,175,55,0.2);border-color:var(--gold);}

  /* CHAT + NEWS + MORE */
  .chat-box{background:linear-gradient(135deg,#1A2E47,#14253E);border:1px solid var(--gold);border-radius:16px;padding:16px;margin-bottom:18px;}
  .chat-box h3{font-family:var(--display);font-size:19px;margin-bottom:3px;}
  .chat-box p{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.45;}
  .chat-in{display:flex;gap:8px;}
  .chat-in input{flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px;font-size:14px;}
  .chat-in button{background:var(--gold);color:#0A1422;border:none;border-radius:10px;padding:0 18px;font-weight:700;font-family:var(--ui);}
  .soon-note{font-family:var(--mono);font-size:9px;letter-spacing:.5px;color:var(--gold2);margin-top:9px;}
  .morelink{display:block;margin-top:18px;font-size:13px;color:var(--gold2);text-decoration:none;border:1px solid var(--line);padding:11px 14px;border-radius:9px;text-align:center;cursor:pointer;}
  .morelink:hover{border-color:var(--gold);color:var(--gold);}
  .newsgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .newsbox{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;}
  .newsbox:active{transform:scale(0.99);}.newsbox:hover{border-color:var(--gold);}
  .newsbox .ic{font-size:22px;}.newsbox .t{font-weight:600;margin-top:8px;font-size:14px;}.newsbox .q{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;}

  /* WEBSITES */
  .wshot{width:100%;border-radius:10px;border:1px solid var(--line);display:block;background:var(--bg3);min-height:60px;}
  .wshot.sm{height:118px;object-fit:cover;object-position:top;}
  .pagemap{display:flex;align-items:center;gap:8px;min-width:max-content;padding-bottom:6px;}
  .mapnode{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;white-space:nowrap;color:var(--ink);}
  .maparrow{color:var(--gold2);font-size:13px;}

  /* DASHBOARD CARDS (Home) */
  .dashcard{background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:15px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .1s;}
  .dashcard:active{transform:scale(0.99);}
  .dashcard:hover{border-color:var(--gold);}
  .dashcard .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
  .dashcard .dt{font-family:var(--display);font-size:17px;font-weight:700;color:var(--ink);}
  .dashcard .chip{font-family:var(--mono);font-size:9px;color:var(--gold2);background:rgba(212,175,55,0.12);padding:3px 9px;border-radius:999px;letter-spacing:1px;}
  .dashcard .metric{font-size:13px;color:var(--ink);}
  .dashcard .metric b{color:var(--gold);font-family:var(--display);font-size:19px;}
  .dashcard .todo{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:8px;line-height:1.4;}
  .dashcard .todo .lab{color:var(--gold2);font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;padding-top:2px;}

  /* BI PANELS (Home) */
  .panelgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:13px;align-items:stretch;}
  .panel{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;}
  .panel.tap{cursor:pointer;} .panel.tap:active{transform:scale(0.995);} .panel.tap:hover{border-color:var(--gold);}
  .panel .ptitle{display:block;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:6px;margin-bottom:12px;}
  .gauge-sub{text-align:center;font-size:11px;color:var(--muted);margin-top:4px;}
  .wkbars{display:flex;justify-content:space-between;align-items:flex-end;gap:6px;height:90px;padding:0 2px;}
  .wkbars .wb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
  .wkbars .bar{width:100%;border-radius:4px 4px 0 0;min-height:4px;}
  .wkbars .lbl{font-family:var(--mono);font-size:9px;color:var(--muted);}
  .ptable{width:100%;border-collapse:collapse;}
  .ptable td{padding:8px 4px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink);}
  .ptable td:nth-child(2),.ptable td:nth-child(3){text-align:right;color:var(--gold2);font-family:var(--mono);font-size:11.5px;}
  .ptable tr:last-child td{border-bottom:none;}
  .hbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .hbar:last-child{margin-bottom:0;}
  .hbar .hl{font-size:11.5px;color:var(--ink);width:104px;flex:none;}
  .hbar .htrack{flex:1;height:14px;background:var(--bg3);border-radius:7px;overflow:hidden;}
  .hbar .htrack i{display:block;height:100%;border-radius:7px;}
  .hbar .hv{font-family:var(--mono);font-size:11px;color:var(--gold2);width:26px;text-align:right;flex:none;}

  /* OPERATIONS rows */
  .opitem{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .opitem:last-child{border-bottom:none;}
  .odot{width:8px;height:8px;border-radius:50%;flex:none;}
  .oname{flex:1;color:var(--ink);}
  .ocad{font-family:var(--mono);font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}

  /* FULL-SCREEN CHAT */
  .chatscreen{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;}
  .chatscreen.open{display:flex;}
  .cs-head{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line);background:var(--bg2);}
  .cs-back{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 13px;font-size:16px;cursor:pointer;flex:none;}
  .cs-title-in{flex:1;min-width:0;background:var(--bg3);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 12px;font-size:14px;font-family:var(--ui);}
  .cs-title-in:focus{outline:none;border-color:var(--gold);}
  .cs-agents-top{font-family:var(--mono);font-size:10px;color:var(--gold2);white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;}
  .cs-toggle{background:none;border:1px solid var(--line);color:var(--gold2);border-radius:8px;padding:8px 11px;font-size:12px;cursor:pointer;flex:none;}
  .cs-body{flex:1;display:grid;grid-template-columns:1fr;min-height:0;}
  @media(min-width:820px){ .cs-body{grid-template-columns:1fr 320px;} .cs-toggle{display:none;} }
  .cs-main{display:flex;flex-direction:column;min-height:0;}
  .cs-thread{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:11px;}
  .cs-empty{margin:auto;text-align:center;color:var(--muted);max-width:340px;}
  .msg{max-width:82%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .msg.u{align-self:flex-end;background:var(--gold);color:#0A1422;border-bottom-right-radius:4px;}
  .msg.a{align-self:flex-start;background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-bottom-left-radius:4px;}
  .msg.sys{align-self:center;background:rgba(212,175,55,0.1);color:var(--gold2);font-size:11.5px;font-family:var(--mono);text-align:center;}
  .cs-input{display:flex;gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg2);}
  .cs-input textarea{flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:12px;font-size:14px;font-family:var(--ui);resize:none;max-height:120px;}
  .cs-input textarea:focus{outline:none;border-color:var(--gold);}
  .cs-send{background:var(--gold);color:#0A1422;border:none;border-radius:12px;padding:0 18px;font-weight:700;cursor:pointer;flex:none;}
  .cs-side{border-left:1px solid var(--line);background:var(--bg2);overflow-y:auto;padding:16px;}
  @media(max-width:819px){ .cs-side{position:fixed;inset:0;z-index:210;display:none;border-left:none;} .cs-side.open{display:block;} }
  .cs-side .sec{margin-top:18px;} .cs-side .sec:first-of-type{margin-top:0;}
  .chip-row{display:flex;flex-wrap:wrap;gap:7px;}
  .achip{font-size:12px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;}
  .achip.on{border-color:var(--gold);color:var(--ink);background:rgba(212,175,55,0.1);}
  .achip .d{width:8px;height:8px;border-radius:50%;}
  .fld{margin-bottom:12px;} .fld label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--gold2);margin-bottom:5px;}
  .fld input,.fld textarea,.fld select{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 10px;font-size:13px;font-family:var(--ui);}
  .fld textarea{min-height:64px;resize:vertical;}
  .cs-save{width:100%;background:var(--gold);color:#0A1422;border:none;border-radius:10px;padding:11px;font-weight:700;cursor:pointer;}
  .savedtask{padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;cursor:pointer;}
  .savedtask:hover{border-color:var(--gold);}
  .savedtask .st-t{color:var(--ink);font-weight:600;font-size:12.5px;}
  .savedtask .st-m{color:var(--muted);font-size:11px;margin-top:2px;}
  .cs-side-close{display:none;}
  @media(max-width:819px){ .cs-side-close{display:block;width:100%;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px;margin-bottom:14px;cursor:pointer;} }
</style>
</head>
<body>

<div class="hdr">
  <div class="b">BBC Command Center<small id="hdr-sub">OPERATING SYSTEM</small></div>
  <div class="date" id="hdr-date">2026-06-02</div>
</div>

<main id="app"></main>

<div class="sheet" id="sheet"><div class="sheet-inner"><div class="grab"></div><div id="sheet-body"></div></div></div>

<!-- FULL-SCREEN CUH CHAT -->
<div class="chatscreen" id="chatscreen">
  <div class="cs-head">
    <button class="cs-back" onclick="closeChat()">&larr;</button>
    <input class="cs-title-in" id="cs-title" placeholder="What are we working on? (task title)">
    <span class="cs-agents-top" id="cs-agents-top">Cuh</span>
    <button class="cs-toggle" onclick="toggleSide()">Setup</button>
  </div>
  <div class="cs-body">
    <div class="cs-main">
      <div class="cs-thread" id="cs-thread"></div>
      <div class="cs-input">
        <textarea id="cs-msg" rows="1" placeholder="Message Cuh..."></textarea>
        <button class="cs-send" onclick="sendMsg()">Send</button>
      </div>
    </div>
    <div class="cs-side" id="cs-side">
      <button class="cs-side-close" onclick="toggleSide()">Done</button>
      <div class="sec">AI agent(s) — pick one or more</div>
      <div class="chip-row" id="cs-agentpicker"></div>
      <div class="sec">Task details</div>
      <div class="fld"><label>Description</label><textarea id="cs-desc" placeholder="What we're trying to do and why"></textarea></div>
      <div class="fld"><label>Category</label><select id="cs-cat"></select></div>
      <div class="fld"><label>Client</label><select id="cs-client"></select></div>
      <div class="fld"><label>Tags</label><input id="cs-tags" placeholder="comma, separated"></div>
      <button class="cs-save" onclick="saveTask()">Save task</button>

<script>
  const D = JSON.parse(document.getElementById('bbc-data').textContent);

  const pillStatus=s=>`<span class="pill p-${s==='active'?'active':s==='dev'?'dev':'concept'}">${s}</span>`;

  function openSheet(html){ sheetBody.innerHTML=html; sheet.classList.add('open'); }
  sheet.onclick=e=>{ if(e.target===sheet) sheet.classList.remove('open'); };

  /* ---------- VIEWS ---------- */
  const views={};

  views.home=()=>{
    const ship=D.workflows.reduce((n,w)=>n+ORDER.filter(a=>w.artifacts[a]).length,0);
    const dueToday=D.content.days.find(x=>x.d.includes('Jun 2'));
    const pending=D.content.days.filter(x=>!x.posted).length;
    return `<div class="chat-box" onclick="openChat()" style="cursor:pointer">
        <h3>Chat with Cuh</h3>
        <p>Your all-around AI. Tap to open full-screen chat, pick your agent(s), and save it as a task.</p>
        <div class="chat-in"><input placeholder="Ask Cuh anything..." readonly style="cursor:pointer"><button>Open chat</button></div>
        <div class="soon-note">FULL-SCREEN CHAT READY · LIVE REPLIES WHEN THE API KEY IS WIRED</div>
      </div>
      ${(()=>{
        const gaps=80-ship;
        const wfReady=Math.round(ship/80*100);
        const weekPosted=D.content.days.filter(x=>x.posted).length;
        const clientsNoAI=D.clients.filter(c=>c.ai==='-').length;
        const gauge=(p,sub)=>{const r=74,c=Math.PI*r,len=(p/100)*c;return `<svg viewBox="0 0 180 116" style="width:100%;max-width:210px;display:block;margin:0 auto"><path d="M16 100 A ${r} ${r} 0 0 1 164 100" fill="none" stroke="#22324d" stroke-width="15" stroke-linecap="round"/><path d="M16 100 A ${r} ${r} 0 0 1 164 100" fill="none" stroke="#D4AF37" stroke-width="15" stroke-linecap="round" stroke-dasharray="${len} ${c}"/><text x="90" y="88" text-anchor="middle" font-family="Playfair Display,serif" font-size="36" font-weight="700" fill="#F5F1EA">${p}%</text><text x="90" y="108" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="10" fill="#C9A961">${sub}</text></svg>`;};
        const weekBars=D.content.days.map(x=>{const has=(x.graphic&&x.graphic!=='-')||(x.reel&&x.reel!=='-');const h=x.posted?100:(has?68:22);const col=x.posted?'#4ADE80':(has?'#D4AF37':'#2a3a52');return `<div class="wb"><div class="bar" style="height:${h}%;background:${col}"></div><div class="lbl">${esc(x.d.split(' ')[0][0])}</div></div>`;}).join('');
        const grp=g=>D.websitePages.filter(p=>p.group===g).length;
        const webRows=`<tr><td>Main pages</td><td>${grp('Main pages')}</td></tr><tr><td>VA profiles</td><td>${grp('VA profiles (noindex)')}</td></tr><tr><td>Internal</td><td>${grp('Internal (noindex)')}</td></tr><tr><td>Open tasks</td><td>${D.websiteTasks.length}</td></tr>`;
        const attn=[{l:'Workflow gaps',v:gaps,m:80},{l:'Posts pending',v:pending,m:7},{l:'Website tasks',v:D.websiteTasks.length,m:10},{l:'Clients w/o AI',v:clientsNoAI,m:D.clients.length}];
        const attnBars=attn.map(a=>{const r=a.v/a.m;const col=r>0.66?'#EF6B6B':(r>0.33?'#D4AF37':'#4ADE80');const w=Math.max(8,Math.round(r*100));return `<div class="hbar"><span class="hl">${a.l}</span><div class="htrack"><i style="width:${w}%;background:${col}"></i></div><span class="hv">${a.v}</span></div>`;}).join('');
        const clientRows=D.clients.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.handler)}</td><td>${c.ai!=='-'?'AI ✓':'—'}</td></tr>`).join('');
        return `<div class="sec">Business at a glance</div>
          <div class="panelgrid">
            <div class="panel tap" onclick="go('workflows')"><span class="ptitle">Workflow Readiness</span>${gauge(wfReady,ship+' of 80 artifacts')}<div class="gauge-sub">${gaps} gaps to ship</div></div>
            <div class="panel tap" onclick="go('social')"><span class="ptitle">This Week</span><div class="wkbars">${weekBars}</div><div class="gauge-sub">${weekPosted} of 7 posted</div></div>
            <div class="panel tap" onclick="go('websites')"><span class="ptitle">Websites</span><table class="ptable">${webRows}</table></div>
            <div class="panel"><span class="ptitle">Needs Attention</span>${attnBars}</div>
            <div class="panel tap" onclick="go('clients')"><span class="ptitle">Clients (${D.clients.length})</span><table class="ptable">${clientRows}</table></div>
          </div>`;
      })()}
      ${(()=>{
        const cc={daily:'#D4AF37',weekly:'#60A5FA',monthly:'#7C8AA5','as needed':'#7C8AA5',active:'#4ADE80'};

          return `<div class="panel"><span class="ptitle" style="color:${o.color}">${esc(o.area)}</span>${rows}</div>`;
        }).join('');
        return `<div class="sec">Operations — what needs attention</div><div class="panelgrid">${boxes}</div>`;
      })()}
      <a class="morelink" onclick="go('more')">AI Family · Team · Systems →</a>`;
  };

  views.clients=()=>{
    const cards=D.clients.map((c,i)=>`<div class="card" onclick="clientSheet(${i})">

          <div class="row1" style="margin-top:9px;justify-content:space-between"><div class="meta" style="margin:0">${esc(w.role)}</div><div class="mini">${pips}</div></div></div>`;
      }).join('');
      return `<div class="sec">${esc(cat)}</div>${rows}`;
    }).join('');
    return `<h2 class="vt">Workflows</h2><div class="vsub">16 shareable systems · ${D.workflows.reduce((n,w)=>n+ORDER.filter(a=>w.artifacts[a]).length,0)} of 80 artifacts shipped.</div>
      <input class="search" placeholder="Search workflows..." oninput="filterCards(this,'wfwrap')">
      <div id="wfwrap">${body}</div>`;
  };

  views.social=()=>{
    const today='Jun 2';
    const cells=D.content.days.map(x=>{
      const parts=x.d.split(' '); const dow=parts[0]; const dnum=parts.slice(1).join(' ');
      const isToday=x.d.includes(today);
      const evs=[];
      if(x.graphic && x.graphic!=='-') evs.push(`<div class="ev ev-g ${x.posted?'done':''}">▦ ${esc(x.graphic)}</div>`);
      if(x.reel && x.reel!=='-') evs.push(`<div class="ev ev-r ${x.posted?'done':''}">▶ ${esc(x.reel)}</div>`);
      if(!evs.length) evs.push(`<div class="ev ev-none">—</div>`);
      return `<div class="cal-day ${isToday?'today':''}"><div class="cal-dh"><span class="dow">${dow}</span><span class="dnum">${dnum}</span>${isToday?'<span class="todaytag">today</span>':''}</div><div class="cal-ev">${evs.join('')}</div></div>`;
    }).join('');
    const pillars=D.contentPillars.map(p=>`<div class="card"><div class="row1"><div class="nm" style="font-size:14px">${esc(p.day)} · ${esc(p.slot)}</div></div><div class="meta">${esc(p.note)}</div></div>`).join('');
    const accts=D.socialAccounts.map(a=>`<div class="card"><div class="row1"><div class="nm" style="font-size:15px">${esc(a.platform)}</div><span class="meta" style="margin:0">${esc(a.handle)}</span></div></div>`).join('');
    return `<h2 class="vt">Social Media</h2><div class="vsub">Calendar · pillars · accounts</div>
      <div class="sec">This week (${esc(D.content.weekOf)}) · swipe sideways</div>
      <div class="cal-scroll"><div class="cal-week">${cells}</div></div>
      <div class="cal-legend"><span><i class="lg ev-g"></i>Graphic</span><span><i class="lg ev-r"></i>Reel</span><span><i class="lg done"></i>Posted</span><span><i class="lg pend"></i>Pending</span></div>
      <div class="sec">Weekly content framework</div>${pillars}
      <div class="sec">Accounts</div>${accts}
      <div class="sec">Analytics</div><div class="card"><div class="meta">Connect Google + platform APIs to enable live analytics here.</div></div>`;
  };
  const pageUrl=p=>{ if(p.path==='index.html') return 'https://balaynibruno.co'; return 'https://balaynibruno.co/'+p.path.replace('.html','').replace(/\/$/,''); };
  const shot=(url,w,h)=>`https://image.thum.io/get/width/${w}/crop/${h}/noanimate/${url}`;
  views.websites=()=>{
    const hero=`<div class="card" onclick="window.open('https://balaynibruno.co','_blank')">
      <img class="wshot" src="${shot('https://balaynibruno.co',600,420)}" loading="lazy" alt="balaynibruno.co preview">
      <div class="row1" style="margin-top:11px"><span class="dot" style="background:var(--green)"></span><div class="nm">balaynibruno.co</div><span class="pill p-active">live</span></div>
      <div class="meta">BBC main site · tap to open</div></div>`;
    const map=D.siteNav.map((n,i)=>`<span class="mapnode">${esc(n)}</span>${i<D.siteNav.length-1?'<span class="maparrow">→</span>':''}`).join('');
    const groups=[...new Set(D.websitePages.map(p=>p.group))];
    const pagesByGroup=groups.map(g=>{
      const items=D.websitePages.filter(p=>p.group===g).map(p=>{
        const gi=D.websitePages.indexOf(p);
        return `<div class="card" onclick="pageSheet(${gi})"><div class="row1"><span class="dot" style="background:var(--green)"></span><div class="nm" style="font-size:15px">${esc(p.name)}</div>${p.noindex?'<span class="pill p-concept">noindex</span>':''}</div><div class="meta">${esc(p.purpose)}</div></div>`;
      }).join('');
      return `<div class="sec">${esc(g)} (${D.websitePages.filter(p=>p.group===g).length})</div>${items}`;
    }).join('');
    const csites=D.clients.filter(c=>c.site&&c.site!=='-').map(c=>{
      const url='https://'+c.site.replace(/^https?:\/\//,'');
      return `<div class="card" onclick="window.open('${url}','_blank')"><img class="wshot sm" src="${shot(url,500,300)}" loading="lazy" alt=""><div class="row1" style="margin-top:9px"><div class="nm" style="font-size:14.5px">${esc(c.name)}</div></div><div class="meta">${esc(c.site)} · ${esc(c.handler)}</div></div>`;
    }).join('');
    const tasks=D.websiteTasks.map(t=>`<div class="card"><div class="row1"><span class="dot" style="background:var(--gold)"></span><div class="nm" style="font-size:14px">${esc(t)}</div></div></div>`).join('');
    return `<h2 class="vt">Websites</h2><div class="vsub">balaynibruno.co + client sites · tap any page for details</div>
      <div class="sec">BBC site</div>${hero}
      <div class="sec">Page map (main nav flow)</div><div class="cal-scroll"><div class="pagemap">${map}</div></div>
      <div class="sec">All pages (${D.websitePages.length})</div>${pagesByGroup}
      <div class="sec">Client sites (${D.clients.filter(c=>c.site&&c.site!=='-').length})</div><div class="grid2">${csites}</div>
      <div class="sec">Website tasks</div>${tasks}
      <div class="sec">Analytics</div><div class="card"><div class="meta">Live Google Analytics + Search Console appear here once the service account is wired.</div></div>`;
  };
  window.pageSheet=i=>{ const p=D.websitePages[i]; const url=pageUrl(p);
    openSheet(`<h3>${esc(p.name)}</h3><div class="row1">${p.noindex?'<span class="pill p-concept">noindex</span>':'<span class="pill p-active">live</span>'} · ${esc(p.group)}</div>
      <img class="wshot" src="${shot(url,600,420)}" loading="lazy" alt="" style="margin:10px 0">
      <div class="sec">Purpose</div><div class="kv"><span>${esc(p.purpose)}</span></div>
      <div class="sec">URL</div><a class="lnk" href="${url}" target="_blank">${url}</a>`);
  };
  views.reminders=()=>`<h2 class="vt">Reminders</h2><div class="vsub">General + daily to-do</div>
    <div class="sec">Today</div><div class="card"><div class="meta">No items yet. When the brain is wired, Cuh adds reminders here from your chats, and Kriz's reminders log syncs in.</div></div>
    <div class="sec">General</div><div class="card"><div class="meta">Standing reminders will live here.</div></div>`;
  views.news=()=>{
    const boxes=D.newsTopics.map((t,i)=>`<div class="newsbox" onclick="newsSearch(${i})"><div class="ic">🔎</div><div class="t">${esc(t.label)}</div><div class="q">${esc(t.q)}</div></div>`).join('');
    const feed=D.newsFeed.map(f=>`<div class="card"><div class="nm" style="font-size:14px">${esc(f.title)}</div><div class="meta">${esc(f.date)} · ${esc(f.path)}</div></div>`).join('');
    return `<h2 class="vt">News &amp; Research</h2><div class="vsub">Tap a box → Cuh runs a deep search on that topic and saves it (brain layer).</div>
      <div class="newsgrid">${boxes}</div>
      <div class="sec">Recent research (Drive)</div>${feed}`;
  };
  window.newsSearch=i=>{ const t=D.newsTopics[i]; openSheet(`<h3>${esc(t.label)}</h3><div class="sec">Search brief</div><div class="kv"><span>${esc(t.q)}</span></div><div class="sec">Status</div><div class="kv"><span>Auto deep-search activates when the brain layer (Anthropic API) is wired. For now, tell Cuh in Claude Code: "deep search ${esc(t.q)}".</span></div>`); };

  views.more=()=>{
    const ai=D.aiFamily.map(a=>`<div class="card" onclick="aiSheet('${a.key}')"><div class="row1"><div class="av" style="background:${OWN[a.key]||'#888'}">${esc(a.name[0])}</div><div class="nm" style="font-size:15px">${esc(a.name)}</div>${pillStatus(a.status)}</div><div class="meta">${esc(a.role)}</div></div>`).join('');
    const team=D.team.map(t=>`<div class="card"><div class="row1"><div class="av" style="background:linear-gradient(135deg,#2A4A6E,#1C3250);color:#F5F1EA">${esc(t.name[0])}</div><div class="nm" style="font-size:15px">${esc(t.name)}</div></div><div class="meta">${esc(t.role)}</div></div>`).join('');
    const sys=D.systems.map(s=>`<a class="lnk" title="${esc(s.path)}">🧩 ${esc(s.name)} <span style="opacity:.6">— ${esc(s.path)}</span></a>`).join('');
    return `<h2 class="vt">More</h2><div class="vsub">AI Family · Team · Systems</div>
      <div class="sec">AI Family (${D.aiFamily.length})</div>${ai}
      <div class="sec">Team (${D.team.length})</div>${team}
      <div class="sec">Systems &amp; SOPs</div>${sys}`;
  };

  /* ---------- SHEETS ---------- */
  window.wfSheet=id=>{ const w=D.workflows.find(x=>x.id===id);
    const arts=ORDER.map(a=>`<div class="art ${w.artifacts[a]?'on':''}"><div class="ic">${w.artifacts[a]?'✔':ICON[a]}</div><div class="nm">${a}</div></div>`).join('');
    openSheet(`<h3>${esc(w.title)}</h3><div class="row1">${w.owners.map(o=>`<span class="dot" style="background:${OWN[o]||'#888'}"></span>${o}`).join(' ')} · ${esc(w.cat)}</div>
      <div class="bar"><i style="width:${pct(w)}%"></i></div>
      <div class="sec">The angle</div><div class="angle">"${esc(w.angle)}"</div><div class="kv" style="margin-top:8px"><span>Audience: ${esc(w.audience)}</span></div>
      <div class="sec">Content readiness (${pct(w)}%)</div><div class="arts">${arts}</div>
      <div class="sec">Ship the gaps</div><div class="kv"><span>Run WORKFLOW_CONTENT_FLOW.md: graphic → video → page → social → zip. Each shipped artifact lights a cell.</span></div>`);
  };
  window.clientSheet=i=>{ const c=D.clients[i];
    openSheet(`<h3>${esc(c.name)}</h3><div class="row1">${pillStatus(c.status)} · ${esc(c.industry)}</div>
      <div class="sec">Details</div>
      <div class="kv"><b>Owner:</b> <span>${esc(c.owner)}</span></div>
      <div class="kv"><b>BBC Handler:</b> <span>${esc(c.handler)}</span></div>
      <div class="kv"><b>AI:</b> <span>${esc(c.ai)}</span></div>
      <div class="kv"><b>Site:</b> <span>${esc(c.site)}</span></div>
      <div class="sec">Notes</div><div class="kv"><span>${esc(c.notes)||'—'}</span></div>`);
  };
  window.aiSheet=key=>{ const a=D.aiFamily.find(x=>x.key===key);
    openSheet(`<h3>${esc(a.name)}</h3><div class="row1">${pillStatus(a.status)}</div><div class="sec">Role</div><div class="kv"><span>${esc(a.role)}</span></div>`);
  };

  /* ---------- ROUTER ---------- */
  window.go=v=>{ app.innerHTML=`<div class="view">${views[v]()}</div>`; window.scrollTo(0,0);
    document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
    sheet.classList.remove('open'); };
  window.filterCards=(inp,wrapId)=>{ const q=inp.value.toLowerCase(); const wrap=document.getElementById(wrapId);
    wrap.querySelectorAll('.card').forEach(c=>{ const hay=(c.dataset.search||c.textContent).toLowerCase(); c.style.display=hay.includes(q)?'':'none'; }); };
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));

  /* ---------- Full-screen Cuh chat ---------- */
  const CHAT_AGENTS=[{k:'Cuh',c:'#D4AF37'}].concat(D.aiFamily.filter(a=>a.key!=='Brunz').map(a=>({k:a.name.split(' ')[0],c:OWN[a.key]||'#7C8AA5'})));
  let csAgents=new Set(['Cuh']); let csThread=[]; let csEditingId=null;
  function csTasks(){ try{return JSON.parse(localStorage.getItem('bbc_tasks')||'[]');}catch(e){return [];} }
  function renderAgents(){
    const el=document.getElementById('cs-agentpicker');
    el.innerHTML=CHAT_AGENTS.map(a=>`<span class="achip ${csAgents.has(a.k)?'on':''}" data-k="${a.k}"><span class="d" style="background:${a.c}"></span>${a.k}</span>`).join('');
    el.querySelectorAll('.achip').forEach(c=>c.onclick=()=>{const k=c.dataset.k; if(csAgents.has(k)){if(csAgents.size>1)csAgents.delete(k);}else csAgents.add(k); renderAgents();});
    document.getElementById('cs-agents-top').textContent=[...csAgents].join(' + ');
  }
  function renderThread(){
    const el=document.getElementById('cs-thread');
    if(!csThread.length){ el.innerHTML=`<div class="cs-empty"><h3 style="font-family:var(--display);color:var(--ink);margin-bottom:8px">Start with Cuh</h3><p>Type below. Pick your agent(s) and fill the task details so this chat is saved as an organized workflow.</p></div>`; return; }
    el.innerHTML=csThread.map(m=>`<div class="msg ${m.r}">${esc(m.t)}</div>`).join('');
    el.scrollTop=el.scrollHeight;
  }
  function renderSaved(){
    const el=document.getElementById('cs-saved'); const all=csTasks();
    el.innerHTML=all.length?all.slice(0,8).map(x=>`<div class="savedtask" data-id="${x.id}"><div class="st-t">${esc(x.title)}</div><div class="st-m">${esc(x.cat||'')}${x.client&&x.client!=='Internal / BBC'?' · '+esc(x.client):''} · ${(x.agents||[]).join(', ')}</div></div>`).join(''):'<div class="st-m" style="color:var(--muted);font-size:12px">No saved tasks yet.</div>';
    el.querySelectorAll('.savedtask').forEach(d=>d.onclick=()=>loadTask(d.dataset.id));
  }
  function loadTask(id){
    const x=csTasks().find(t=>t.id===id); if(!x)return;
    csEditingId=x.id;
    document.getElementById('cs-title').value=x.title||''; document.getElementById('cs-desc').value=x.desc||'';
    document.getElementById('cs-cat').value=x.cat||'Other'; document.getElementById('cs-client').value=x.client||'Internal / BBC';
    document.getElementById('cs-tags').value=x.tags||'';
    csAgents=new Set(x.agents&&x.agents.length?x.agents:['Cuh']); csThread=x.thread||[];
    renderAgents(); renderThread(); if(window.innerWidth<820) document.getElementById('cs-side').classList.remove('open');
  }
  window.openChat=()=>{
    document.getElementById('cs-cat').innerHTML=['Website','Social Media','Workflow','Client work','Content','Research','Strategy','Other'].map(c=>`<option>${c}</option>`).join('');
    document.getElementById('cs-client').innerHTML=['Internal / BBC',...D.clients.map(c=>c.name)].map(c=>`<option>${esc(c)}</option>`).join('');
    csThread=[]; csAgents=new Set(['Cuh']); csEditingId=null;
    document.getElementById('cs-title').value=''; document.getElementById('cs-desc').value=''; document.getElementById('cs-tags').value='';
    renderAgents(); renderThread(); renderSaved();
    document.getElementById('chatscreen').classList.add('open');
    setTimeout(()=>document.getElementById('cs-title').focus(),120);
  };
  window.closeChat=()=>document.getElementById('chatscreen').classList.remove('open');
  window.toggleSide=()=>document.getElementById('cs-side').classList.toggle('open');
  window.sendMsg=()=>{
    const ta=document.getElementById('cs-msg'); const v=ta.value.trim(); if(!v) return;
    csThread.push({r:'u',t:v}); ta.value='';
    csThread.push({r:'sys',t:'Saved to this task. '+[...csAgents].join(' + ')+' will reply live once the Anthropic API key is wired.'});
    renderThread();
  };
  window.saveTask=()=>{
    const t=document.getElementById('cs-title').value.trim()||'Untitled task';
    const task={id:csEditingId||('t'+Date.now()),title:t,desc:document.getElementById('cs-desc').value,cat:document.getElementById('cs-cat').value,client:document.getElementById('cs-client').value,tags:document.getElementById('cs-tags').value,agents:[...csAgents],thread:csThread};
    const all=csTasks(); const i=all.findIndex(x=>x.id===task.id); if(i>=0)all[i]=task; else all.unshift(task);
    try{localStorage.setItem('bbc_tasks',JSON.stringify(all));}catch(e){}
    csEditingId=task.id; renderSaved();
    const b=document.querySelector('.cs-save'); b.textContent='Saved ✓'; setTimeout(()=>b.textContent='Save task',1500);
  };
  document.getElementById('cs-msg').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();window.sendMsg();} });

  /* PWA service worker — auto-update so deploys show without manual cache clears */
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg=>{ reg.update&&reg.update(); }).catch(()=>{});
    let refreshing=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(refreshing) return; refreshing=true; location.reload(); });
  }

  go('home');
</script>
</body>
</html>
