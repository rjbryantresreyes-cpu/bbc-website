<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BBC Command Center</title>
<link rel="icon" href="/os/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FDFBF7; --surface:#FFFFFF; --surface-2:#FBF6EE;
  --ink:#2E241D; --ink-2:#5A4A3C; --muted:#8A7868;
  --line:#EDE3D6; --line-2:#E3D5C3;
  --terracotta:#C4643C; --terracotta-soft:#F6E5DC;
  --sage:#5F8A66; --sage-soft:#E6F0E5;
  --amber:#C98A1E; --amber-soft:#FBEED6;
  --clay:#BE4237; --clay-soft:#F9E2DF;
  --gold:#A8792F;
  --radius:16px; --radius-lg:22px;
  --shadow:0 1px 2px rgba(64,42,24,.05), 0 6px 20px rgba(64,42,24,.06);
  --shadow-lg:0 2px 6px rgba(64,42,24,.06), 0 18px 44px rgba(64,42,24,.10);
  /* Newsreader + Hanken Grotesk rather than the Fraunces/Inter pairing every AI-built
     dashboard reaches for. Newsreader is warm and editorial, which suits "balay";
     Hanken Grotesk is humanist rather than neutral, so numbers stay friendly. */
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  /* Warmth that scrolls with the page. A fixed decorative layer (background-attachment
     or a fixed ::before) painted over the content during capture and costs scroll
     performance on mobile, so it is deliberately not fixed. */
  background-image:
    radial-gradient(1100px 520px at 12% 0%, #FFF4E4 0%, transparent 58%),
    radial-gradient(900px 460px at 96% 2%, #F1EEFA 0%, transparent 52%);
  background-repeat:no-repeat;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 90px}
a{color:inherit}

/* ---------- header ---------- */
header.top{
  position:sticky; top:0; z-index:50; backdrop-filter:blur(12px);
  background:rgba(253,251,247,.82); border-bottom:1px solid var(--line);
}
.top-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.brand .mark{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(145deg,var(--terracotta),#9E4A2A); color:#fff;
  box-shadow:0 4px 12px rgba(196,100,60,.28);
}
.brand h1{font-family:var(--serif);font-size:22px;font-weight:700;margin:0;letter-spacing:-.3px}
.brand p{margin:1px 0 0;font-size:11.5px;color:var(--muted);letter-spacing:.10em;text-transform:uppercase;font-weight:600}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  font-size:12.5px;font-weight:600;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)
}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--sage)}
.pill.stale{background:var(--amber-soft);border-color:#EBD5A4;color:#7A5A12}
.pill.stale .dot{background:var(--amber)}
.btn{
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  padding:8px 15px;border-radius:10px;font:600 13px var(--sans);cursor:pointer;transition:.15s
}
.btn:hover{background:var(--surface-2);border-color:var(--terracotta);color:var(--terracotta)}

/* ---------- section headings ---------- */
.sec{margin:38px 0 0}
.sec-head{display:flex;align-items:baseline;gap:12px;margin:0 0 15px}
.sec-head h2{font-family:var(--serif);font-size:28px;font-weight:700;margin:0;letter-spacing:-.4px}
.sec-head .sub{font-size:13px;color:var(--muted)}
.rule{height:1px;background:linear-gradient(90deg,var(--line-2),transparent);margin:9px 0 18px}

/* ---------- attention ---------- */
.attention{
  border-radius:var(--radius-lg); padding:22px 24px; margin-top:26px;
  background:linear-gradient(135deg,#FFF4EF,#FDECE6); border:1px solid #F2CDBE;
  box-shadow:var(--shadow);
}
.attention.calm{background:linear-gradient(135deg,#EEF6EC,#E6F1E4);border-color:#CBE1C6}
.attention h2{font-family:var(--serif);font-size:23px;font-weight:700;margin:0 0 3px;display:flex;align-items:center;gap:10px}
.attention .lead{font-size:13.5px;color:var(--ink-2);margin:0 0 16px}
.att-list{display:grid;gap:10px}
.att{
  display:flex;gap:13px;align-items:flex-start;background:rgba(255,255,255,.82);
  border:1px solid rgba(190,66,55,.16); border-radius:13px; padding:13px 15px;
}
.att .sev{
  flex:none;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 9px;border-radius:6px;margin-top:1px
}
.sev-blocking{background:var(--clay);color:#fff}
.sev-decision{background:var(--amber);color:#fff}
.sev-watch{background:var(--surface-2);color:var(--gold);border:1px solid #E8D5AE}
.att .body{min-width:0}
.att .t{font-weight:650;font-size:14px;margin:0 0 2px}
.att .d{font-size:13px;color:var(--ink-2);margin:0}
.att .who{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:4px}

/* collapsed (non-blocking) items: one scannable line, detail on click */
details.att-fold{display:block;padding:11px 15px;cursor:pointer}
details.att-fold summary{
  display:flex;align-items:baseline;gap:10px;list-style:none;flex-wrap:wrap;min-width:0
}
details.att-fold summary::-webkit-details-marker{display:none}
details.att-fold summary .t{margin:0;flex:1;min-width:180px;font-weight:650;font-size:14px}
details.att-fold summary .who{margin:0;font-size:11.5px;color:var(--muted);font-weight:600}
details.att-fold summary .sev{flex:none}
details.att-fold summary::after{
  content:"▸";color:var(--muted);font-size:12px;margin-left:auto;flex:none
}
details.att-fold[open] summary::after{content:"▾"}
details.att-fold[open] .d{margin:9px 0 2px}
details.att-fold .d{margin:0}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
.tile{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:17px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden
}
.tile::after{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--terracotta);opacity:.85}
.tile.ok::after{background:var(--sage)} .tile.warn::after{background:var(--amber)} .tile.bad::after{background:var(--clay)}
.tile .k{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--serif);font-size:34px;font-weight:700;line-height:1.05;margin:7px 0 2px;letter-spacing:-.6px}
.tile .n{font-size:12.5px;color:var(--ink-2)}

/* ---------- client cards ---------- */
.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:.18s
}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--line-2)}
.card-top{padding:17px 19px 14px;border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:flex-start}
.avatar{
  flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  font-family:var(--serif);font-weight:700;font-size:18px;color:#fff
}
.card h3{margin:0;font-size:15.5px;font-weight:680;letter-spacing:-.15px}
.card .meta{margin:3px 0 0;font-size:12px;color:var(--muted);line-height:1.45}
.badge{
  font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;white-space:nowrap
}
.b-active{background:var(--sage-soft);color:#3E6B45}
.b-hold{background:var(--amber-soft);color:#8A6414}
.b-unconfirmed{background:var(--surface-2);color:var(--gold);border:1px solid #E8D5AE}

.services{padding:13px 19px;display:grid;gap:8px}
.svc{display:flex;align-items:center;gap:10px;font-size:13px}
.svc .lbl{width:74px;flex:none;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.svc .state{display:flex;align-items:center;gap:7px;min-width:0;flex:1}
.sdot{width:8px;height:8px;border-radius:50%;flex:none}
.s-ok{background:var(--sage)} .s-warn{background:var(--amber)} .s-problem{background:var(--clay)}
.s-unknown{background:#C9BCAD} .s-quiet{background:#C9BCAD}
.svc .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.svc .num{margin-left:auto;font-weight:700;font-size:12.5px;color:var(--ink);flex:none}

.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:3px}
.bar > span{display:block;height:100%;border-radius:3px}

.card-foot{margin-top:auto;padding:12px 19px 15px;border-top:1px solid var(--line);background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2)}
.chip.fix{background:var(--sage-soft);border-color:#CBE1C6;color:#3E6B45}
.chip.talk{background:#EDF1FA;border-color:#D3DDF0;color:#3D5580}
.quiet{font-size:12px;color:var(--muted);font-style:italic}

/* ---------- ring ---------- */
/* ring stacks above its label: side-by-side left too little width and broke words mid-word */
.ring-wrap{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:8px}
.ring-wrap .n{line-height:1.35}
.ring{width:64px;height:64px;flex:none}
.ring .track{stroke:var(--line);stroke-width:9;fill:none}
.ring .val{stroke:var(--sage);stroke-width:9;fill:none;stroke-linecap:round;transition:stroke-dashoffset .9s ease}
.ring-num{font-family:var(--serif);font-size:19px;font-weight:700;fill:var(--ink)}

/* ---------- unverified ---------- */
.unver{
  background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--radius);
  padding:17px 19px
}
.unver h3{margin:0 0 4px;font-size:14.5px;font-weight:680}
.unver p{margin:0 0 11px;font-size:12.5px;color:var(--muted)}
.unver .chips .chip{background:var(--surface-2)}

/* ---------- past ---------- */
details.past{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px}
details.past summary{cursor:pointer;font-weight:650;font-size:14px;list-style:none}
details.past summary::-webkit-details-marker{display:none}
details.past summary::before{content:"▸ ";color:var(--muted)}
details.past[open] summary::before{content:"▾ "}
.past-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px;margin-top:13px}
.past-item{background:var(--surface-2);border-radius:11px;padding:12px 14px;font-size:12.5px}
.past-item b{display:block;font-size:13.5px;margin-bottom:3px}
.past-item span{color:var(--muted)}

footer.foot{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

@media (max-width:640px){
  .wrap{padding:0 14px 70px}
  .brand h1{font-size:17px}
  .sec-head h2{font-size:21px}
  .clients{grid-template-columns:1fr}
  .tile .v{font-size:26px}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="mark">🏠</div>
      <div>
        <h1>BBC Command Center</h1>
        <p>Balay ni Bruno &amp; Co.</p>
      </div>
    </div>
    <span class="pill" id="freshness"><span class="dot"></span><span id="fresh-text">loading…</span></span>
    <button class="btn" id="refresh">Refresh</button>
  </div>
</header>

<div class="wrap">
  <section id="attention-host"></section>

  <section class="sec">
    <div class="sec-head"><h2>Balay ni Bruno &amp; Co.</h2><span class="sub">our own numbers</span></div>
    <div class="rule"></div>
    <div class="tiles" id="bbc-tiles"></div>
  </section>

  <section class="sec">
    <div class="sec-head"><h2>Clients</h2><span class="sub" id="client-sub"></span></div>
    <div class="rule"></div>
    <div class="clients" id="clients"></div>
  </section>

  <section class="sec" id="unver-host"></section>
  <section id="past-host"></section>

  <footer class="foot">
    <span>Published by the daily routine. Report only, nothing here changes a client system.</span>
    <span id="foot-time"></span>
  </footer>
</div>

<script>
const ENDPOINT = "/.netlify/functions/routine-snapshot";
const FALLBACK = "/os/routine-snapshot.json";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AV = ["#C4643C","#5F8A66","#8A6BA8","#C98A1E","#4A7C9B","#B0554F","#6E8B4A","#A8792F"];
const avatarColor = id => AV[[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0) % AV.length];

const SERVICE_LABEL = {website:"Website", email:"Email", leads:"Leads", social:"Social", store:"Store", crm:"CRM"};

function stateOf(s){ return (s && s.state) || "unknown"; }

function serviceLine(key, s){
  const st = stateOf(s);
  let txt = s?.detail || "not checked";
  let num = "";
  let bar = "";

  if (key === "email" && st === "ok") {
    const lists = s.lists || [];
    const total = s.contacts ?? lists.reduce((a,l)=>a+l.contacts,0);
    const dead  = lists.reduce((a,l)=>a+(l.blacklisted||0),0);
    const live  = lists.reduce((a,l)=>a+l.contacts,0);
    const pct   = live ? Math.round(100*dead/live) : 0;
    const camps = (s.campaigns||[]).length;
    txt = camps ? `${camps} campaign${camps>1?"s":""} in play` : "no campaign running";
    num = total ? total.toLocaleString() : "";
    if (live) {
      const col = pct >= 40 ? "var(--clay)" : pct >= 15 ? "var(--amber)" : "var(--sage)";
      bar = `<div class="bar" title="${pct}% of contacts are dead addresses">
               <span style="width:${Math.max(pct,2)}%;background:${col}"></span></div>`;
    }
  }
  return `<div class="svc">
      <span class="lbl">${SERVICE_LABEL[key]||key}</span>
      <span class="state"><span class="sdot s-${st}"></span>
        <span class="txt">${esc(txt)}</span></span>
      ${num?`<span class="num">${esc(num)}</span>`:""}
    </div>${bar}`;
}

function clientCard(c){
  const services = Object.entries(c.services || {})
    .map(([k,v]) => serviceLine(k,v)).join("");

  const wa = c.whatsapp || {};
  const chips = [];
  (c.fixes||[]).forEach(f => chips.push(`<span class="chip fix">✓ ${esc(f.title||f.detail||"fix")}</span>`));
  if (wa.state === "ok")    chips.push(`<span class="chip talk">💬 ${wa.count} message${wa.count===1?"":"s"} in chat</span>`);
  if (wa.state === "quiet") chips.push(`<span class="chip">💬 chat quiet</span>`);
  (c.updates||[]).forEach(u => chips.push(`<span class="chip">${esc(u.title||u)}</span>`));

  const foot = chips.length
    ? `<div class="chips">${chips.join("")}</div>`
    : `<span class="quiet">Nothing logged for today yet.</span>`;

  const initial = (c.name||"?").replace(/^(The )/,"").charAt(0).toUpperCase();
  const metaBits = [c.what, c.handler ? `Handler ${c.handler}` : null, c.ai ? `AI ${c.ai}` : null]
    .filter(Boolean).join(" · ");

  return `<article class="card">
    <div class="card-top">
      <div class="avatar" style="background:${avatarColor(c.id)}">${esc(initial)}</div>
      <div style="min-width:0;flex:1">
        <h3>${esc(c.name)}</h3>
        <p class="meta">${esc(metaBits)}</p>
      </div>
      <span class="badge b-${c.status}">${esc(c.status)}</span>
    </div>
    ${services ? `<div class="services">${services}</div>`
               : `<div class="services"><span class="quiet">${esc(c.note || "No services configured yet.")}</span></div>`}
    <div class="card-foot">${foot}</div>
  </article>`;
}

function ring(ok, total){
  const pct = total ? ok/total : 0, R = 32, C = 2*Math.PI*R;
  return `<svg class="ring" viewBox="0 0 78 78" aria-label="${ok} of ${total} sites up">
    <circle class="track" cx="39" cy="39" r="${R}"/>
    <circle class="val" cx="39" cy="39" r="${R}"
      stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"
      transform="rotate(-90 39 39)"/>
    <text class="ring-num" x="39" y="45" text-anchor="middle">${ok}/${total}</text>
  </svg>`;
}

function render(d){
  // ---- freshness
  const gen = d.generated_at ? new Date(d.generated_at) : null;
  const hrs = gen ? (Date.now()-gen.getTime())/36e5 : 999;
  const fresh = document.getElementById("freshness");
  document.getElementById("fresh-text").textContent =
    gen ? (hrs < 1 ? "updated just now" : hrs < 24 ? `updated ${Math.round(hrs)}h ago` : `${Math.round(hrs/24)}d old`)
        : "never run";
  fresh.className = "pill" + (hrs > 26 ? " stale" : "");
  document.getElementById("foot-time").textContent = gen ? `Snapshot ${d.shift_date} · ${gen.toLocaleString()}` : "";

  // ---- attention
  const att = d.attention || [];
  document.getElementById("attention-host").innerHTML = att.length
    ? `<div class="attention">
         <h2>⚠︎ Needs you</h2>
         <p class="lead">${att.length} item${att.length>1?"s":""} the routine could not decide on its own.</p>
         <div class="att-list">${att.map(a=>{
           const sev = esc(a.severity||"watch");
           const badge = `<span class="sev sev-${sev}">${sev}</span>`;
           const who = a.client ? esc(a.client) : "";
           // Blocking items are always open. Everything else stays one line until asked,
           // so the page opens as a scan, not a wall of paragraphs.
           // <summary> MUST be the first child of <details>, so the badge lives inside it.
           return sev === "blocking"
             ? `<div class="att">${badge}<div class="body">
                  <p class="t">${esc(a.title)}</p>
                  <p class="d">${esc(a.detail||"")}</p>
                  ${who?`<p class="who">${who}</p>`:""}</div></div>`
             : `<details class="att att-fold">
                  <summary>${badge}<span class="t">${esc(a.title)}</span>
                    ${who?`<span class="who">${who}</span>`:""}</summary>
                  <p class="d">${esc(a.detail||"")}</p></details>`;
         }).join("")}</div>
       </div>`
    : `<div class="attention calm">
         <h2>✓ Nothing needs you</h2>
         <p class="lead" style="margin:0">The routine ran clean. Everything below is for information.</p>
       </div>`;

  // ---- BBC tiles
  const clients = d.clients || [];
  // only count sites we actually have a URL for. A client with no URL configured is
  // unknown, not down, and must never be drawn as a failing site.
  const withSite = clients.filter(c => c.services?.website?.url);
  const sitesOk  = withSite.filter(c => c.services.website.state === "ok").length;
  const talking  = clients.filter(c => c.whatsapp?.state === "ok").length;
  const b = d.bbc || {};
  const tiles = [];

  tiles.push(`<div class="tile ${sitesOk===withSite.length?"ok":"bad"}">
      <div class="k">Client sites</div>
      <div class="ring-wrap">${ring(sitesOk, withSite.length)}
        <div><div class="n">${sitesOk===withSite.length?"all responding":"needs a look"}</div></div>
      </div></div>`);

  tiles.push(`<div class="tile"><div class="k">Active clients</div>
      <div class="v">${clients.filter(c=>c.status==="active").length}</div>
      <div class="n">${clients.filter(c=>c.status==="hold").length} on hold</div></div>`);

  tiles.push(`<div class="tile ${talking?"ok":""}"><div class="k">Client chats</div>
      <div class="v">${talking}</div>
      <div class="n">had traffic in the last 2 days</div></div>`);

  if (b.bounce_rate != null) {
    const bad = b.bounce_rate >= 5;
    tiles.push(`<div class="tile ${bad?"bad":"ok"}"><div class="k">Bounce rate</div>
      <div class="v">${b.bounce_rate}%</div>
      <div class="n">${esc(b.bounce_note||"")}</div></div>`);
  }
  if (b.emails_sent_24h != null) {
    tiles.push(`<div class="tile ${b.emails_sent_24h?"ok":"warn"}"><div class="k">Emails sent 24h</div>
      <div class="v">${b.emails_sent_24h}</div>
      <div class="n">${esc(b.email_note||"")}</div></div>`);
  }
  const unv = (d.unverified||[]).length;
  tiles.push(`<div class="tile ${unv?"warn":"ok"}"><div class="k">Unverified</div>
      <div class="v">${unv}</div>
      <div class="n">not checked, not "fine"</div></div>`);

  document.getElementById("bbc-tiles").innerHTML = tiles.join("");

  // ---- clients
  document.getElementById("clients").innerHTML = clients.map(clientCard).join("");
  document.getElementById("client-sub").textContent =
    `${clients.filter(c=>c.status==="active").length} active · ${(d.past_clients||[]).length} past`;

  // ---- unverified
  document.getElementById("unver-host").innerHTML = unv ? `
    <div class="sec-head"><h2>Not checked</h2><span class="sub">these are unknown, not healthy</span></div>
    <div class="rule"></div>
    <div class="unver">
      <h3>${unv} thing${unv>1?"s":""} this run could not see</h3>
      <p>Most need a key or an ID from the client before they can ever be checked.</p>
      <div class="chips">${d.unverified.map(u=>`<span class="chip">${esc(u)}</span>`).join("")}</div>
    </div>` : "";

  // ---- past
  const past = d.past_clients || [];
  document.getElementById("past-host").innerHTML = past.length ? `
    <details class="past">
      <summary>Past clients (${past.length}) — kept for reference</summary>
      <div class="past-grid">${past.map(p=>`
        <div class="past-item"><b>${esc(p.name)}</b><span>${esc(p.note||p.what||"")}</span></div>`).join("")}</div>
    </details>` : "";
}

async function load(){
  let data = null;
  try {
    const r = await fetch(ENDPOINT, {cache:"no-store"});
    if (r.ok) { const j = await r.json(); if (!j.empty) data = j; }
  } catch {}
  if (!data) {
    try { const r = await fetch(FALLBACK, {cache:"no-store"}); if (r.ok) data = await r.json(); } catch {}
  }
  if (!data) {
    document.getElementById("attention-host").innerHTML =
      `<div class="attention"><h2>No snapshot yet</h2>
       <p class="lead" style="margin:0">Run the daily routine to fill this in.</p></div>`;
    return;
  }
  render(data);
}

document.getElementById("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
