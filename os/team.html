<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team · BBC Command Center</title>
<link rel="icon" href="/os/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/os/bbc-os.css">
<style>
  /* Team rows reuse .client-row for visual consistency but aren't links to a
     detail page (there's no team/[name].html yet), so the hover-lift affordance
     that implies "click me" is switched off. */
  .team-row{cursor:default}
  .team-row:hover{transform:none;box-shadow:var(--shadow);border-color:var(--line)}
  .team-row .notes{margin:5px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
</style>
</head>
<body>


<div class="wrap">
  <section class="sec" style="margin-top:26px">
    <div class="sec-head"><h2>Team</h2><span class="sub" id="sub"></span></div>
    <div class="rule"></div>
    <div id="list"></div>
  </section>

  <footer class="foot">
    <span>Roster comes from data/team.json, generated from CLAUDE.md's ## TEAM section by scripts/sync-claude-md.mjs. Edit CLAUDE.md, not this page.</span>
    <span id="foot-time"></span>
  </footer>
</div>

<script src="/os/bbc-os.js"></script>
<script>
osChrome("Team");

function memberRow(m){
  const initial = esc((m.name || "?").trim().charAt(0).toUpperCase());
  return `<div class="client-row team-row">
    <div class="avatar" style="background:${avatarColor(m.name)}">${initial}</div>
    <div class="who">
      <h3>${esc(m.name)}</h3>
      <p class="meta">${esc(m.title || "")}</p>
      ${m.notes ? `<p class="notes">${esc(m.notes)}</p>` : ""}
    </div>
  </div>`;
}

// team.json changes only when someone edits CLAUDE.md's team section and re-runs
// scripts/sync-claude-md.mjs, so it's normal for it to be days or weeks old.
// A much looser staleness bar than the routine snapshot's 26h (bbc-os.js) avoids
// a nagging "stale" pill on a file that isn't meant to refresh daily.
const STALE_HOURS = 24 * 30;

function stampTeamFreshness(d){
  const pill = document.getElementById("freshness");
  const text = document.getElementById("fresh-text");
  const foot = document.getElementById("foot-time");
  const age = fmtAge(d && d.generated_at);
  if (text) text.textContent = age.text;
  if (pill) pill.className = "pill" + (age.hours > STALE_HOURS ? " stale" : "");
  if (foot && d && d.generated_at) {
    foot.textContent = `Generated ${new Date(d.generated_at).toLocaleString()}`;
  }
}

function render(d){
  stampTeamFreshness(d);
  const team = d.team || [];
  document.getElementById("list").innerHTML = team.length
    ? team.map(memberRow).join("")
    : `<p class="empty-note">No team roster yet. Run scripts/sync-claude-md.mjs.</p>`;
  document.getElementById("sub").textContent = `${team.length} team member${team.length === 1 ? "" : "s"}`;
}

(async function init(){
  let data = null;
  try {
    const r = await fetch("/os/team.json", { cache:"no-store" });
    if (r.ok) data = await r.json();
  } catch {}
  if (!data) {
    document.getElementById("list").innerHTML =
      `<p class="empty-note">No /os/team.json yet. Run scripts/sync-claude-md.mjs, which writes data/team.json — mirror/deploy it to /os/team.json.</p>`;
    return;
  }
  render(data);
})();
</script>
</body>
</html>
