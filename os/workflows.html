<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workflows · BBC Command Center</title>
<link rel="icon" href="/os/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/os/bbc-os.css">
</head>
<body>
<div class="wrap">
  <section class="sec" style="margin-top:26px">
    <div class="sec-head"><h2>Workflows</h2><span class="sub">every scheduled job on this device</span></div>
    <div class="rule"></div>
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="sec" id="fail-host"></section>

  <section class="sec">
    <div class="sec-head"><h2>All jobs</h2><span class="sub">failing first, then switched off, then healthy</span></div>
    <div class="rule"></div>
    <div id="tasks"></div>
  </section>

  <footer class="foot">
    <span>Exit code is shown, not flattened to a tick. A job that handles its own error still exits 0.</span>
    <span id="foot-time"></span>
  </footer>
</div>

<script src="/os/bbc-os.js"></script>
<script>
osChrome("Workflows");

/* Windows exit codes that mean something specific and are worth translating,
   because "3221225786" tells nobody anything. */
const CODE_MEANING = {
  0:          "completed",
  267009:     "currently running",
  267011:     "has never run",
  267014:     "was stopped by the user",
  2147942401: "file or path not found",
  3221225786: "killed part-way (Ctrl+C or shutdown)",
  2147946720: "could not start",
};

function render(d){
  stampFreshness(d);
  const w = d.workflows || {};
  const tasks = w.tasks || [];

  if (!tasks.length) {
    document.getElementById("tasks").innerHTML =
      `<p class="empty-note">${esc(w.detail || "Scheduled tasks were not read this run.")}</p>`;
    return;
  }

  const healthy = w.ok || 0, total = w.total || tasks.length;
  document.getElementById("tiles").innerHTML = [
    `<div class="tile ${w.failing ? "bad" : "ok"}"><div class="k">Healthy</div>
       <div class="ring-wrap">${donut(healthy, total, "jobs healthy")}
       <div class="n">of ${total} jobs</div></div></div>`,
    statTile("Failing", w.failing || 0, w.failing ? "need attention" : "none", w.failing ? "bad" : "ok"),
    statTile("Switched off", w.disabled || 0, "deliberately disabled", w.disabled ? "warn" : "ok"),
  ].join("");

  const failing = tasks.filter(t => t.health === "problem");
  document.getElementById("fail-host").innerHTML = failing.length ? `
    <div class="attention" style="margin-top:0">
      <h2>⚠︎ ${failing.length} job${failing.length>1?"s":""} failing</h2>
      <p class="lead">These ran and did not finish cleanly.</p>
      <div class="att-list">${failing.map(t => `
        <div class="att">
          <span class="sev sev-blocking">failed</span>
          <div class="body">
            <p class="t">${esc(t.name)}</p>
            <p class="d">${esc(CODE_MEANING[t.result] || ("exit code " + t.result))}${
              t.last_run ? ` · last ran ${esc(t.last_run)}` : ""}</p>
          </div>
        </div>`).join("")}</div>
    </div>` : "";

  const TONE_FOR = { problem:"var(--clay)", disabled:"var(--muted)", running:"var(--amber)", ok:"var(--sage)" };
  const WORD = { problem:"failing", disabled:"off", running:"running", ok:"ok" };

  document.getElementById("tasks").innerHTML = `<div class="panel">
    ${tasks.map(t => `
      <div class="step">
        <span class="sdot" style="background:${TONE_FOR[t.health]};flex:none"></span>
        <span class="sj" style="font-weight:${t.health==="problem"?"680":"500"}">${esc(t.name)}</span>
        <span class="sj" style="color:var(--muted);font-size:12px">
          ${esc(t.last_run || "never run")}</span>
        <span class="here" style="color:${TONE_FOR[t.health]};width:62px">${WORD[t.health]}</span>
      </div>`).join("")}
  </div>`;
}

loadSnapshot(render, () => {
  document.getElementById("tasks").innerHTML =
    `<p class="empty-note">No routine snapshot yet. Run the daily routine to fill this in.</p>`;
});
</script>
</body>
</html>
