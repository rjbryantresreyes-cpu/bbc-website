<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Wooden Woodworks — Command Center</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
<style>
  :root{
    --bg:#F3ECE0;--bg2:#FBF8F2;--card:#FFFFFF;--ink:#2B2723;--muted:#857B6E;--soft:#A99E8E;
    --walnut:#5E4329;--walnut2:#7A5836;--brass:#B08D4F;--brass-d:#977636;--sage:#7E8B6D;
    --line:rgba(94,67,41,0.15);--line2:rgba(94,67,41,0.07);--green:#5E8B6D;--amber:#C08A3E;--blue:#5E7790;
    --serif:Georgia,'Times New Roman',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 6px 26px rgba(94,67,41,0.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased;}
  svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.12em;}

  .app{display:flex;min-height:100dvh;}
  /* Sidebar */
  .side{width:236px;flex:none;background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100dvh;overflow-y:auto;padding:16px 0;display:flex;flex-direction:column;}
  .side .brand{display:flex;align-items:center;gap:11px;padding:0 18px 14px;border-bottom:1px solid var(--line);margin-bottom:8px;}
  .side .brand img{height:34px;}
  .side .brand .t{font-family:var(--serif);font-weight:700;font-size:14px;line-height:1.1;}
  .side .brand .s{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--brass-d);margin-top:1px;}
  .nav{flex:1;}
  .navlink{display:flex;align-items:center;gap:11px;padding:10px 18px;font-size:13.5px;color:var(--muted);cursor:pointer;border-left:3px solid transparent;}
  .navlink:hover{color:var(--ink);background:rgba(94,67,41,0.04);}
  .navlink.on{color:var(--walnut);border-left-color:var(--brass);background:rgba(176,141,79,0.1);font-weight:600;}
  .navlink.locked{opacity:.4;pointer-events:none;}
  .navlink .ic{width:18px;display:flex;justify-content:center;font-size:16px;flex:none;}
  .nav-group{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--soft);padding:14px 18px 5px;font-weight:700;}
  .side .role{margin:10px 14px 4px;padding:11px;background:var(--card);border:1px solid var(--line2);border-radius:11px;}
  .side .role .lbl{font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--soft);margin-bottom:6px;font-weight:700;}
  .side .role select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--sans);font-size:13px;background:var(--bg2);color:var(--ink);}

  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{background:var(--bg2);border-bottom:1px solid var(--line);padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10;}
  .topbar .menu{display:none;background:none;border:1px solid var(--line);border-radius:9px;width:40px;height:40px;cursor:pointer;font-size:18px;}
  .topbar .ptitle{font-family:var(--serif);font-weight:700;font-size:18px;}
  .topbar .right{display:flex;align-items:center;gap:10px;}
  .sync{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--green);background:rgba(94,139,109,0.12);border:1px solid rgba(94,139,109,0.25);padding:6px 11px;border-radius:20px;font-weight:600;}
  .sync .pulse{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,139,109,.5)}70%{box-shadow:0 0 0 7px rgba(94,139,109,0)}100%{box-shadow:0 0 0 0 rgba(94,139,109,0)}}
  .out{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:8px 13px;background:none;cursor:pointer;}
  .view{flex:1;padding:24px;max-width:1000px;width:100%;margin:0 auto;}
  iframe.ownerframe{width:100%;height:calc(100dvh - 120px);border:1px solid var(--line2);border-radius:14px;background:#fff;}

  .vhead{margin-bottom:18px;}
  .vhead h1{font-family:var(--serif);font-size:24px;font-weight:700;}
  .vhead p{color:var(--muted);font-size:14px;margin-top:3px;}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  @media(max-width:640px){.stat-row{grid-template-columns:1fr 1fr;}}
  .stat{background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:15px;text-align:center;box-shadow:var(--shadow);}
  .stat .v{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--walnut);}
  .stat .l{font-size:11px;color:var(--muted);margin-top:3px;}
  .card{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
  .card h3{font-family:var(--serif);font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:9px;}
  .chk{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px;}
  .chk:last-child{border-bottom:none;}
  .chk input{width:18px;height:18px;accent-color:var(--walnut);flex:none;cursor:pointer;}
  .chk.done label{text-decoration:line-through;color:var(--soft);}
  .chk label{flex:1;}.chk .area{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--brass-d);background:rgba(176,141,79,0.13);padding:3px 7px;border-radius:5px;}
  .addrow{display:flex;gap:8px;margin-top:12px;}
  .addrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-family:var(--sans);font-size:16px;background:var(--bg2);}
  .addrow input:focus{outline:none;border-color:var(--brass);}
  .btn{background:var(--walnut);color:#fff;border:none;border-radius:10px;padding:0 16px;font-weight:600;font-size:14px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:7px;font-family:var(--sans);}
  .btn:hover{background:var(--walnut2);}
  .placeholder{text-align:center;padding:60px 20px;color:var(--muted);}
  .placeholder .ic{font-size:40px;color:var(--brass);opacity:.6;}
  .placeholder h2{font-family:var(--serif);font-size:22px;color:var(--ink);margin:14px 0 6px;}
  .placeholder .tag{font-size:13px;background:rgba(176,141,79,0.13);color:var(--brass-d);padding:5px 12px;border-radius:20px;display:inline-block;margin-top:10px;font-weight:600;}
  /* Calendar */
  .cal{background:var(--card);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
  .cal-hd,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
  .cal-hd{background:var(--bg2);border-bottom:1px solid var(--line);}
  .cal-hd div{padding:9px 6px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .cal-cell{min-height:88px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:6px;}
  .cal-cell .dn{font-weight:700;color:var(--muted);font-size:11px;}
  .cal-cell.dim{background:var(--bg2);}
  .cal-cell.today{background:rgba(176,141,79,0.09);}
  .cpost{font-size:10px;padding:3px 6px;border-radius:5px;margin-top:4px;color:#fff;font-weight:600;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cpost.ig{background:#C13584;}.cpost.fb{background:#4267B2;}.cpost.tt{background:#222;}.cpost.yt{background:#C4302B;}.cpost.gbp{background:#4285F4;}
  .leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted);}
  .leg span{display:inline-flex;align-items:center;gap:6px;}.leg i{width:11px;height:11px;border-radius:3px;}
  @media(max-width:640px){.cal-cell{min-height:62px;padding:4px;}.cpost{font-size:9px;}}
  /* Kanban */
  .kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;}
  .kcol{min-width:190px;flex:1;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:11px;}
  .kcol h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--brass-d);margin-bottom:9px;display:flex;justify-content:space-between;font-family:var(--sans);}
  .kcard{background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:11px;margin-bottom:8px;box-shadow:var(--shadow);}
  .kcard .kt{font-weight:600;font-size:13px;}.kcard .km{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .scrim2{position:fixed;inset:0;background:rgba(43,39,35,.4);z-index:30;display:none;}
  @media(max-width:860px){
    .side{position:fixed;left:0;top:0;z-index:31;transform:translateX(-100%);transition:transform .25s;}
    .side.open{transform:translateX(0);}
    .scrim2.open{display:block;}
    .topbar .menu{display:block;}
  }
  /* Woody */
  .woody-fab{position:fixed;bottom:18px;right:18px;z-index:25;background:var(--walnut);color:#fff;border:none;border-radius:30px;padding:12px 17px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 10px 30px rgba(94,67,41,0.4);display:flex;align-items:center;gap:9px;}
  .woody-fab .av{width:24px;height:24px;border-radius:50%;background:var(--brass);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:13px;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="ic-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v9h12v-9"/></symbol>
  <symbol id="ic-cabinet" viewBox="0 0 24 24"><path d="M5 3h14v18H5z"/><path d="M12 3v18M5 12h14"/></symbol>
  <symbol id="ic-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></symbol>
  <symbol id="ic-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M17 9h4M3 15h4M17 15h4"/></symbol>
  <symbol id="ic-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16M8 3v4M16 3v4"/></symbol>
  <symbol id="ic-houzz" viewBox="0 0 24 24"><path d="M5 3v18l7-4 7 4V3"/></symbol>
  <symbol id="ic-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5"/></symbol>
  <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></symbol>
  <symbol id="ic-check2" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
  <symbol id="ic-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.8 1.5-1.5 0-1.6 1-2.5 2.5-2.5h1A4 4 0 0 0 21 13c0-5-4-10-9-10z"/></symbol>
  <symbol id="ic-owner" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></symbol>
  <symbol id="ic-send" viewBox="0 0 24 24"><path d="M4 12l16-7-7 16-2-7z"/></symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</defs></svg>

<div class="app">
  <aside class="side" id="side">
    <div class="brand"><img src="wooden-woodworks-logo.png" alt="WW"><div><div class="t">Wooden Woodworks</div><div class="s">Command Center</div></div></div>
    <div class="role"><div class="lbl">Preview — view as</div><select id="roleSel" onchange="setRole(this.value)"><option value="krizza">Krizza (manager, full)</option><option value="rj">RJ (BBC, full)</option><option value="owner">Oscar &amp; Marla (owners)</option></select></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="scrim2" id="scrim2" onclick="toggleSide()"></div>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px"><button class="menu" onclick="toggleSide()">&#9776;</button><span class="ptitle" id="ptitle">Home</span></div>
      <div class="right"><span class="sync"><span class="pulse"></span>Synced</span><button class="out">Sign out</button></div>
    </div>
    <div class="view" id="view"></div>
  </div>
</div>
<button class="woody-fab" onclick="toast('Woody chat opens here, same as the owners page')"><span class="av">W</span> Ask Woody</button>

<script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
<script>
var notyf;try{notyf=new Notyf({duration:2200,position:{x:'center',y:'top'},types:[{type:'success',background:'#5E4329'}]});}catch(e){}
function toast(m){if(notyf)notyf.success(m);}
function ic(id){return '<svg class="i"><use href="#'+id+'"/></svg>';}

/* pages: who can see them. owners only get 'owners'. */
var PAGES=[
  {id:'home',name:'Home',icon:'ic-home',group:'Krizza'},
  {id:'owners',name:'Owners Dashboard',icon:'ic-owner',group:'Krizza',owner:true},
  {id:'projects',name:'Projects',icon:'ic-cabinet',group:'Work'},
  {id:'clients',name:'Clients',icon:'ic-briefcase',group:'Work'},
  {id:'reels',name:'Reels',icon:'ic-film',group:'Content'},
  {id:'social',name:'Social Calendar',icon:'ic-calendar',group:'Content'},
  {id:'houzz',name:'Houzz',icon:'ic-houzz',group:'Content'},
  {id:'leads',name:'Leads & CRM',icon:'ic-search',group:'Growth'},
  {id:'seo',name:'SEO & Google',icon:'ic-search',group:'Growth'},
  {id:'approvals',name:'Approvals',icon:'ic-check2',group:'Ops'},
  {id:'brand',name:'Brand & Assets',icon:'ic-palette',group:'Ops'},
  {id:'team',name:'Team',icon:'ic-people',group:'Ops'}
];
var ROLE='krizza';
var krizzaTasks=[
  {t:'Draft 4 reels for this week',a:'Content',done:false},
  {t:'Publish 2 Google Business posts',a:'SEO',done:false},
  {t:'Follow up new builder lead in HubSpot',a:'Leads',done:true},
  {t:'Schedule the Salado kitchen walkthrough',a:'Social',done:false},
  {t:'Upload Whitman project photos to Houzz',a:'Houzz',done:false},
  {t:'Send monthly report to Oscar & Marla',a:'Ops',done:false},
  {t:'Review owner-submitted content drops',a:'Content',done:false}
];

function setRole(r){ROLE=r;renderNav();var first=ROLE==='owner'?'owners':'home';go(first);if(window.innerWidth<=860&&document.getElementById('side').classList.contains('open'))toggleSide();}
function renderNav(){
  var groups={},nav=document.getElementById('nav');
  var visible=PAGES.filter(p=>ROLE==='owner'?p.owner:true);
  visible.forEach(p=>{(groups[p.group]=groups[p.group]||[]).push(p);});
  nav.innerHTML=Object.keys(groups).map(g=>`<div class="nav-group">${g}</div>`+groups[g].map(p=>`<div class="navlink" data-id="${p.id}" onclick="go('${p.id}')"><span class="ic">${ic(p.icon)}</span>${p.name}</div>`).join('')).join('');
}
function go(id){
  document.querySelectorAll('.navlink').forEach(n=>n.classList.toggle('on',n.dataset.id===id));
  var p=PAGES.find(x=>x.id===id);
  document.getElementById('ptitle').textContent=p?p.name:'Home';
  document.getElementById('view').innerHTML=(views[id]||views.placeholder)(id);
  document.querySelector('.main').scrollTop=0;window.scrollTo(0,0);
}
function toggleSide(){document.getElementById('side').classList.toggle('open');document.getElementById('scrim2').classList.toggle('open');}

var views={
  home:function(){
    var done=krizzaTasks.filter(t=>t.done).length;
    return `<div class="vhead"><h1>Welcome back, Krizza</h1><p>Your Wooden Woodworks command center. Here is everything on your plate today.</p></div>
    <div class="stat-row">
      <div class="stat"><div class="v">${krizzaTasks.length-done}</div><div class="l">Open tasks</div></div>
      <div class="stat"><div class="v">4</div><div class="l">Active projects</div></div>
      <div class="stat"><div class="v">2</div><div class="l">Awaiting approval</div></div>
      <div class="stat"><div class="v">1</div><div class="l">New owner request</div></div>
    </div>
    <div class="card"><h3>${ic('ic-check2')} My tasks</h3><div id="ktasks">${krizzaTasks.map((t,i)=>`<div class="chk ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="krizzaTasks[${i}].done=this.checked;go('home');toast('Updated')"><label>${t.t}</label><span class="area">${t.a}</span></div>`).join('')}</div>
      <div class="addrow"><input id="ktask" placeholder="Add a task..."><button class="btn" onclick="addKT()">${ic('ic-plus')} Add</button></div></div>
    <div class="card"><h3>${ic('ic-owner')} From the owners</h3>
      <div class="chk"><span class="area">New</span><label>Oscar &amp; Marla requested: "Add a showroom page to the website"</label></div>
      <div class="chk"><span class="area">Note</span><label>"Hold the Austin reel until the client approves the final photos."</label></div>
      <p style="color:var(--muted);font-size:13px;margin-top:10px">Owner edits and requests land here automatically. Make them official, then it syncs back to their dashboard.</p>
    </div>`;
  },
  owners:function(){return `<div class="vhead"><h1>Owners Dashboard</h1><p>What Oscar &amp; Marla see and edit. Their changes flow to you here.</p></div><iframe class="ownerframe" src="_ww-owner-preview.html?embed=1"></iframe>`;},
  social:function(){
    var posts={3:[['Reel: island reveal','ig']],5:[['Carousel: 3 finishes','fb'],['GBP: new photos','gbp']],9:[['Reel: shop tour','tt']],12:[['Carousel: frameless vs face-frame','ig']],14:[['Reel: 90-day milestone','ig']],17:[['GBP post','gbp']],20:[['Walk-through: Austin office','yt']],24:[['Reel: finishing process','tt']],27:[['Carousel: showroom progress','fb']]};
    var first=1,cells='';
    for(var i=0;i<first;i++)cells+='<div class="cal-cell dim"></div>';
    for(var d=1;d<=30;d++){var ps=(posts[d]||[]).map(p=>`<div class="cpost ${p[1]}" onclick="toast('${p[0].replace(/'/g,'')}')">${p[0]}</div>`).join('');cells+=`<div class="cal-cell ${d===5?'today':''}"><div class="dn">${d}</div>${ps}</div>`;}
    var total=Math.ceil((first+30)/7)*7;for(var t=first+30;t<total;t++)cells+='<div class="cal-cell dim"></div>';
    return `<div class="vhead"><h1>Social Calendar</h1><p>Content across Instagram, Facebook, TikTok, and YouTube.</p></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b style="font-family:var(--serif);font-size:18px">June 2026</b><button class="btn" onclick="toast('Opening the content composer')">${ic('ic-plus')} Add content</button></div>
    <div class="cal"><div class="cal-hd"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div><div class="cal-grid">${cells}</div></div>
    <div class="leg"><span><i style="background:#C13584"></i> Instagram</span><span><i style="background:#4267B2"></i> Facebook</span><span><i style="background:#222"></i> TikTok</span><span><i style="background:#C4302B"></i> YouTube</span><span><i style="background:#4285F4"></i> Google Profile</span></div>`;
  },
  reels:function(){
    var stages=[['Ideas',[['Hidden Features: soft-close','From brand pillar'],['Showroom build update','Document the progress']]],['Scripting',[['Walk-through: Salado kitchen','Tre voiceover']]],['Filming',[['Finishing process','Margie in the spray booth']]],['Editing',[['Austin office reveal','CapCut + captions']]],['Approval',[['Frameless vs face-frame','Waiting on Marla']]],['Posted',[['90-day milestone','IG + TikTok']]]];
    return `<div class="vhead"><h1>Reels Workflow</h1><p>Walk-throughs are WW's top content. Idea to posted, one board.</p></div>
    <div style="margin-bottom:12px"><button class="btn" onclick="toast('New reel idea added')">${ic('ic-plus')} New reel</button></div>
    <div class="kanban">${stages.map(s=>`<div class="kcol"><h4>${s[0]} <span>${s[1].length}</span></h4>${s[1].map(c=>`<div class="kcard"><div class="kt">${c[0]}</div><div class="km">${c[1]}</div></div>`).join('')}</div>`).join('')}</div>`;
  },
  houzz:function(){
    var url='https://www.houzz.com/pro/webuser-882207478/wooden-woodworks-llc-custom-kitchen-cabinets';
    return `<div class="vhead"><h1>Houzz</h1><p>WW's Houzz profile, where luxury builders and homeowners shop for cabinetry.</p></div>
    <div class="stat-row"><div class="stat"><div class="v">—</div><div class="l">Profile views</div></div><div class="stat"><div class="v">—</div><div class="l">Ideabook saves</div></div><div class="stat"><div class="v">—</div><div class="l">Houzz leads</div></div><div class="stat"><div class="v">—</div><div class="l">Reviews</div></div></div>
    <div class="card"><h3>${ic('ic-houzz')} Profile</h3><a href="${url}" target="_blank" rel="noopener" style="display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line2);margin-bottom:12px"><img src="https://image.thum.io/get/width/900/crop/520/noanimate/${url}" alt="Wooden Woodworks on Houzz" loading="lazy" style="width:100%;display:block;background:var(--bg2)"></a><a href="${url}" target="_blank" rel="noopener" class="btn">${ic('ic-houzz')} View profile on Houzz</a><p style="color:var(--muted);font-size:13px;margin-top:10px">Live stats and leads sync once the Houzz connection is wired.</p></div>
    <div class="card"><h3>${ic('ic-cabinet')} Projects to upload to Houzz</h3><div class="chk"><input type="checkbox"><label>Built-in Office Wall, Austin, installed</label></div><div class="chk"><input type="checkbox"><label>Master Bath Vanity, Waco</label></div><div class="chk"><input type="checkbox"><label>Frameless Kitchen, Salado</label></div></div>
    <div class="card"><h3>${ic('ic-search')} Houzz leads &amp; inquiries</h3><p style="color:var(--muted);font-size:13px">New Houzz inquiries appear here when the connection is live. Respond within 24 hours, Houzz rewards fast responders.</p></div>`;
  },
  placeholder:function(id){var p=PAGES.find(x=>x.id===id)||{name:'Page'};
    var blurb={projects:'Master list of every WW project with full detail, photos, and status.',clients:'All WW clients, builders, designers, and homeowners, with contact history.',reels:'The reel production workflow, idea to draft to approval to posted.',social:'A drag-drop content calendar across Instagram, Facebook, TikTok, and YouTube.',houzz:'The WW Houzz profile embedded, with project uploads and Houzz leads.',leads:'HubSpot builder pipeline, estimate follow-up so no lead goes cold.',seo:'Local Central Texas search, Google Business Profile posts, reviews, and rankings.',approvals:'Your approval queue, BBC work you OK before it reaches the owners.',brand:'WW brand guide, logo, voice, and content references.',team:'WW team and the BBC team serving the account, plus monthly reports.'};
    return `<div class="placeholder"><div class="ic">${ic(p.icon||'ic-cabinet')}</div><h2>${p.name}</h2><p>${blurb[id]||''}</p><div class="tag">Next to build</div></div>`;
  }
};
function addKT(){var v=document.getElementById('ktask').value.trim();if(!v)return;krizzaTasks.push({t:v,a:'New',done:false});go('home');toast('Task added');}

renderNav();go('home');
</script>
