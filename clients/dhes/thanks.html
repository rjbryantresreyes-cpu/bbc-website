<!DOCTYPE html><html lang="en" data-theme="light"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Request Received · Balay ni Bruno &amp; Co.</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--gold:#C9A24A;--gold-soft:#e7d4a3;--cream:#FAFAF8;--ink:#2a2622;--muted:#7c736a;
--card:#fff;--line:#ece6db;--shadow:0 1px 3px rgba(42,38,34,.06),0 8px 30px rgba(42,38,34,.05);--good:#5a8a6b}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
background:var(--cream);color:var(--ink);font-family:'Jost',system-ui,-apple-system,Segoe UI,sans-serif;font-weight:300}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:48px 36px;max-width:460px;text-align:center;box-shadow:var(--shadow)}
.ic{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;background:rgba(90,138,107,.12);color:var(--good);display:grid;place-items:center;font-size:34px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:30px;margin:0 0 10px}
p{color:var(--muted);font-size:15px;line-height:1.7;margin:0 0 8px}
.btn{display:inline-block;margin-top:24px;cursor:pointer;border-radius:999px;padding:13px 30px;font-size:14px;letter-spacing:.03em;background:var(--gold);color:#fff;font-weight:500;text-decoration:none;box-shadow:0 4px 18px rgba(201,162,74,.3)}
.sub{font-size:12.5px;margin-top:18px}
a.ghost{display:inline-block;margin-top:14px;color:var(--gold);font-size:13px;text-decoration:none}
</style></head><body>
<div class="card">
  <div class="ic">&#10003;</div>
  <h1 class="serif">Request received</h1>
  <p>Thanks Dhes. Your request is in and RJ has been notified.</p>
  <p>I will get onto it and send it through when it is ready.</p>
  <a class="btn" href="request.html">Send another request</a>
  <div class="sub"><a class="ghost" href="index.html">Back to your dashboard</a></div>
</div>
</body></html>
