<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<title>My Lot — Balay ni Bruno &amp; Co.</title>
<style>
  :root { --navy:#1F3557; --gold:#B8923E; --cream:#F5F1EA; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family: system-ui, -apple-system, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  #labels { position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden; }
  .lbl3d { color:#fff; font-size:12px; font-weight:600; padding:3px 8px; border-radius:7px;
    background:rgba(20,30,50,.6); border:1px solid rgba(255,255,255,.18); white-space:nowrap;
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); transform:translate(-50%,-50%); }
  .lbl3d.vacant { background:rgba(184,146,62,.28); border-color:rgba(184,146,62,.7); color:#ffe9bf; }

  #overlay { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:var(--cream); background:radial-gradient(circle at 50% 38%, rgba(31,53,87,.82), rgba(10,16,28,.95));
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); padding:24px; transition:opacity .35s ease; }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #overlay h1 { font-size:clamp(22px,5vw,38px); margin-bottom:4px; }
  #overlay .sub { color:var(--gold); font-weight:600; margin-bottom:8px; font-size:clamp(13px,2.5vw,15px); }
  #overlay .scn { opacity:.7; font-size:12px; margin-bottom:22px; }
  #startBtn { background:var(--gold); color:#1a1a1a; border:none; cursor:pointer; font-weight:700; font-size:18px;
    padding:16px 34px; border-radius:999px; box-shadow:0 10px 30px rgba(0,0,0,.4); min-width:220px; min-height:54px; }
  #startBtn:active { transform:translateY(1px); }
  .keys { margin-top:24px; display:flex; gap:12px; flex-wrap:wrap; justify-content:center; opacity:.9; font-size:13px; max-width:520px; }
  .keys span { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); padding:8px 11px; border-radius:9px; }
  .note { margin-top:18px; font-size:12px; opacity:.55; max-width:440px; line-height:1.5; }

  #crosshair { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%;
    background:rgba(255,255,255,.7); z-index:10; pointer-events:none; display:none; }
  #topbar { position:fixed; left:0; right:0; top:0; z-index:11; display:none; justify-content:space-between; align-items:flex-start;
    padding:10px 12px; pointer-events:none; }
  #legend { color:#fff; font-size:12px; background:rgba(15,22,38,.55); padding:8px 12px; border-radius:10px; line-height:1.55;
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); pointer-events:auto; max-width:46vw; }
  #legend b { color:var(--gold); }
  #legend .li { opacity:.9; }
  .btns { display:flex; gap:8px; pointer-events:auto; }
  .btn { background:rgba(15,22,38,.65); color:#fff; border:1px solid rgba(255,255,255,.2); padding:10px 14px; border-radius:10px;
    font-size:13px; cursor:pointer; min-height:44px; }
  .btn.active { background:var(--gold); color:#1a1a1a; border-color:var(--gold); font-weight:700; }
  #hint { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:11; display:none; color:#fff; font-size:12px;
    background:rgba(15,22,38,.55); padding:7px 14px; border-radius:999px; }

  .stick { position:fixed; bottom:26px; z-index:11; width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.18); display:none; touch-action:none; }
  #stickMove { left:22px; } #stickLook { right:22px; }
  .stick .knob { position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px; border-radius:50%; background:rgba(184,146,62,.85); }
  .stick .lbl { position:absolute; bottom:-22px; left:0; right:0; text-align:center; color:#fff; font-size:11px; opacity:.7; }
  body.touch.walking .stick { display:block; }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="crosshair"></div>

<div id="topbar">
  <div id="legend"></div>
  <div class="btns">
    <button id="walkBtn" class="btn active">Walk</button>
    <button id="planBtn" class="btn">Top view</button>
    <button id="exitBtn" class="btn">Exit ✕</button>
  </div>
</div>
<div id="hint"></div>

<div id="stickMove" class="stick"><div class="knob"></div><div class="lbl">MOVE</div></div>
<div id="stickLook" class="stick"><div class="knob"></div><div class="lbl">LOOK</div></div>

<div id="overlay">
  <h1>Walk the Property</h1>
  <div class="sub">Balay ni Bruno &amp; Co.</div>
  <div class="scn" id="scnName">loading scene…</div>
  <button id="startBtn">Enter and walk</button>
  <div class="keys">
    <span>W A S D — walk</span><span>Mouse — look</span><span>Shift — run</span>
    <span>Q / E — float</span><span>V — top view</span>
  </div>
  <div class="note">A sample property, shown to demonstrate the idea. A real project uses your own design, with your buildings, your lot, and your measurements.</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const app = document.getElementById('app');
const overlay = document.getElementById('overlay');
const isTouch = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
if (isTouch) document.body.classList.add('touch');

/* ---------- Renderers ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });
labelRenderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfd6e0, 80, 240);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 2000);
camera.rotation.order = 'YXZ';
const EYE = 1.7;

/* ---------- Sky + lights ---------- */
const sky = new Sky(); sky.scale.setScalar(5000); scene.add(sky);
const sun = new THREE.Vector3();
const u = sky.material.uniforms;
u.turbidity.value = 6; u.rayleigh.value = 1.3; u.mieCoefficient.value = 0.006; u.mieDirectionalG.value = 0.8;
const phi = THREE.MathUtils.degToRad(90-34), theta = THREE.MathUtils.degToRad(140);
sun.setFromSphericalCoords(1, phi, theta); u.sunPosition.value.copy(sun);
scene.add(new THREE.HemisphereLight(0xbfd4f2, 0x6b6a5e, 1.0));
const dir = new THREE.DirectionalLight(0xfff2dd, 2.3);
dir.position.copy(sun).multiplyScalar(80); dir.castShadow = true;
dir.shadow.mapSize.set(2048,2048);
Object.assign(dir.shadow.camera, { left:-70, right:70, top:70, bottom:-70, near:1, far:260 });
dir.shadow.bias = -0.0004; scene.add(dir);

/* ---------- helpers ---------- */
const colliders = [];
const labelEls = [];
function makeLabel(text, x, y, z, vacant){
  const el = document.createElement('div'); el.className = 'lbl3d' + (vacant?' vacant':''); el.textContent = text;
  const o = new CSS2DObject(el); o.position.set(x,y,z); scene.add(o); labelEls.push(o); return o;
}
function grassTexture(rw, rh){
  const c = document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  g.fillStyle='#5c7f47'; g.fillRect(0,0,256,256);
  for(let i=0;i<9000;i++){ const s=60+Math.random()*70; g.fillStyle=`rgba(${s*0.5|0},${s|0},${s*0.45|0},0.5)`; g.fillRect(Math.random()*256,Math.random()*256,2,2); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rw,rh); t.colorSpace=THREE.SRGBColorSpace; return t;
}

let LOT = { width:60, depth:40 };

/* ---------- structure builders ---------- */
function addBuilding(b){
  const grp = new THREE.Group();
  const floors = b.floors||1, fh = b.floorHeight||3, h = floors*fh;
  const body = new THREE.Mesh(new THREE.BoxGeometry(b.w,h,b.d),
    new THREE.MeshStandardMaterial({ color:b.color||0xd9cbb2, roughness:0.85 }));
  body.position.y=h/2; body.castShadow=body.receiveShadow=true; grp.add(body);
  // floor lines
  for(let f=1; f<floors; f++){
    const line=new THREE.Mesh(new THREE.BoxGeometry(b.w+0.04,0.08,b.d+0.04), new THREE.MeshStandardMaterial({color:0x3a3a3a,roughness:.8}));
    line.position.y=f*fh; grp.add(line);
  }
  // door + windows on +z face
  const winMat=new THREE.MeshStandardMaterial({color:0x2a3a4a,roughness:.3,metalness:.1});
  const door=new THREE.Mesh(new THREE.PlaneGeometry(1.1,2.1),new THREE.MeshStandardMaterial({color:0x4a3826,roughness:.7}));
  door.position.set(0,1.05,b.d/2+0.02); grp.add(door);
  for(let f=0; f<floors; f++){
    for(const wx of [-b.w*0.3, b.w*0.3]){
      const w=new THREE.Mesh(new THREE.PlaneGeometry(1.4,1.2),winMat);
      w.position.set(wx, f*fh+fh*0.6, b.d/2+0.02); grp.add(w);
    }
  }
  // roof
  const rc = b.roofColor||0x6b6256;
  if((b.roof||'hip')==='hip'){
    const r=new THREE.Mesh(new THREE.ConeGeometry(Math.max(b.w,b.d)*0.72, fh*0.7, 4), new THREE.MeshStandardMaterial({color:rc,roughness:.7}));
    r.position.y=h+fh*0.35; r.rotation.y=Math.PI/4; r.castShadow=true; grp.add(r);
  } else if(b.roof==='gable'){
    const r=new THREE.Mesh(new THREE.CylinderGeometry(b.d*0.6, b.d*0.6, b.w, 3, 1, false, 0, Math.PI), new THREE.MeshStandardMaterial({color:rc,roughness:.7}));
    r.rotation.z=Math.PI/2; r.position.y=h; r.castShadow=true; grp.add(r);
  } else { // flat parapet
    const r=new THREE.Mesh(new THREE.BoxGeometry(b.w+0.3,0.4,b.d+0.3), new THREE.MeshStandardMaterial({color:rc,roughness:.8}));
    r.position.y=h+0.2; grp.add(r);
  }
  grp.position.set(b.x,0,b.z); grp.rotation.y=THREE.MathUtils.degToRad(b.rotation||0); scene.add(grp);
  const pad=0.4, ex=Math.max(b.w,b.d)/2+pad;
  colliders.push({minX:b.x-ex,maxX:b.x+ex,minZ:b.z-ex,maxZ:b.z+ex});
  makeLabel(b.label||b.id, b.x, h+fh*0.9, b.z);
}
function addCourt(c){
  const grp=new THREE.Group();
  const base=new THREE.Mesh(new THREE.PlaneGeometry(c.w,c.d), new THREE.MeshStandardMaterial({color:0x2f6b4f,roughness:.95}));
  base.rotation.x=-Math.PI/2; base.receiveShadow=true; grp.add(base);
  const inner=new THREE.Mesh(new THREE.PlaneGeometry(c.w*0.82,c.d*0.9), new THREE.MeshStandardMaterial({color:0x9c4a3a,roughness:.95}));
  inner.rotation.x=-Math.PI/2; inner.position.y=0.01; grp.add(inner);
  // lines
  const lineMat=new THREE.MeshBasicMaterial({color:0xffffff});
  function line(w,d,x,z){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),lineMat); m.rotation.x=-Math.PI/2; m.position.set(x,0.02,z); grp.add(m); }
  line(c.w*0.82,0.08,0, c.d*0.45); line(c.w*0.82,0.08,0,-c.d*0.45);
  line(0.08,c.d*0.9,c.w*0.41,0); line(0.08,c.d*0.9,-c.w*0.41,0);
  line(c.w*0.82,0.08,0,0); // net line
  const net=new THREE.Mesh(new THREE.BoxGeometry(c.w*0.86,0.9,0.05), new THREE.MeshStandardMaterial({color:0x222,transparent:true,opacity:.55}));
  net.position.set(0,0.45,0); grp.add(net);
  grp.position.set(c.x,0,c.z); grp.rotation.y=THREE.MathUtils.degToRad(c.rotation||0); scene.add(grp);
  makeLabel(c.label||'Court', c.x, 1.6, c.z);
}
function addPool(p){
  const water=new THREE.Mesh(new THREE.BoxGeometry(p.w,0.4,p.d), new THREE.MeshStandardMaterial({color:0x2aa3c4,roughness:.15,metalness:.2,transparent:true,opacity:.85}));
  water.position.set(p.x,0.18,p.z); scene.add(water);
  const lip=new THREE.Mesh(new THREE.BoxGeometry(p.w+0.6,0.25,p.d+0.6), new THREE.MeshStandardMaterial({color:0xd9d2c4,roughness:.9}));
  lip.position.set(p.x,0.12,p.z); scene.add(lip);
  makeLabel(p.label||'Pool', p.x, 1.0, p.z);
}
function addTree(x,z){
  const grp=new THREE.Group();
  const t=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.3,2.2,7), new THREE.MeshStandardMaterial({color:0x6b4a2f,roughness:1})); t.position.y=1.1; t.castShadow=true; grp.add(t);
  const f=new THREE.Mesh(new THREE.IcosahedronGeometry(1.7,0), new THREE.MeshStandardMaterial({color:0x3f6e34,roughness:1,flatShading:true})); f.position.y=3.4; f.castShadow=true; grp.add(f);
  grp.position.set(x,0,z); scene.add(grp);
  colliders.push({minX:x-0.8,maxX:x+0.8,minZ:z-0.8,maxZ:z+0.8});
}
function addPath(p){
  const dx=p.to[0]-p.from[0], dz=p.to[1]-p.from[1]; const len=Math.hypot(dx,dz);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(p.width||2, len), new THREE.MeshStandardMaterial({color:0xb9ad95,roughness:1}));
  m.rotation.x=-Math.PI/2; m.rotation.z=-Math.atan2(dx,dz);
  m.position.set((p.from[0]+p.to[0])/2, 0.02, (p.from[1]+p.to[1])/2); scene.add(m);
}
function addVacant(s){
  const g=new THREE.Group();
  const fill=new THREE.Mesh(new THREE.PlaneGeometry(s.w,s.d), new THREE.MeshStandardMaterial({color:0xb8923e,transparent:true,opacity:.16}));
  fill.rotation.x=-Math.PI/2; fill.position.y=0.03; g.add(fill);
  const edge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(s.w,s.d)), new THREE.LineBasicMaterial({color:0xb8923e}));
  edge.rotation.x=-Math.PI/2; edge.position.y=0.04; g.add(edge);
  g.position.set(s.x,0,s.z); scene.add(g);
  makeLabel(s.label||'Vacant', s.x, 1.4, s.z, true);
}
function buildFence(){
  const hw=LOT.width/2, hd=LOT.depth/2, step=4, ph=1.1;
  const postMat=new THREE.MeshStandardMaterial({color:0x3a3a3a,roughness:.8}), post=new THREE.BoxGeometry(0.14,ph,0.14);
  const pts=[]; for(let x=-hw;x<=hw;x+=step){pts.push([x,-hd],[x,hd]);} for(let z=-hd;z<=hd;z+=step){pts.push([-hw,z],[hw,z]);}
  pts.forEach(([x,z])=>{const m=new THREE.Mesh(post,postMat);m.position.set(x,ph/2,z);m.castShadow=true;scene.add(m);});
  const railMat=new THREE.MeshStandardMaterial({color:0x5a5a5a,roughness:.8});
  [[-hd],[hd]].forEach(([z])=>{const r=new THREE.Mesh(new THREE.BoxGeometry(LOT.width,0.08,0.08),railMat);r.position.set(0,ph*0.92,z);scene.add(r);});
  [[-hw],[hw]].forEach(([x])=>{const r=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.08,LOT.depth),railMat);r.position.set(x,ph*0.92,0);scene.add(r);});
}

function buildGround(){
  const g=new THREE.Mesh(new THREE.PlaneGeometry(LOT.width,LOT.depth),
    new THREE.MeshStandardMaterial({map:grassTexture(LOT.width/3,LOT.depth/3),roughness:1}));
  g.rotation.x=-Math.PI/2; g.receiveShadow=true; scene.add(g);
  const outer=new THREE.Mesh(new THREE.PlaneGeometry(800,800), new THREE.MeshStandardMaterial({color:0x4f6e3f,roughness:1}));
  outer.rotation.x=-Math.PI/2; outer.position.y=-0.02; outer.receiveShadow=true; scene.add(outer);
}

/* ---------- load scene.json ---------- */
function loadGLB(url){
  return new Promise((res,rej)=>{
    new GLTFLoader().load(url+'?'+Date.now(), gltf=>{
      const root = gltf.scene;
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const ctr = box.getCenter(new THREE.Vector3());
      // center horizontally on origin, drop so the model sits on the ground
      root.position.x -= ctr.x;
      root.position.z -= ctr.z;
      root.position.y -= box.min.y;
      root.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; if(o.material){o.material.side=THREE.DoubleSide;} } });
      scene.add(root);
      // size the lot (ground + camera framing + boundary) to the model footprint + margin
      LOT = { width: Math.ceil(size.x)+10, depth: Math.ceil(size.z)+10, fence:null };
      window.__model = { size, root };
      res(size);
    }, undefined, rej);
  });
}

async function loadScene(){
  const data = await (await fetch('scene.json?'+Date.now())).json();
  LOT = data.lot || LOT;
  let glbSize=null;
  if(data.glb){ glbSize = await loadGLB(data.glb); }
  const dims = data.glb ? (Math.round(glbSize.x)+'×'+Math.round(glbSize.z)+'m') : (LOT.width+'×'+LOT.depth+'m');
  document.getElementById('scnName').textContent = (data.meta?.name||'Scene') + ' — ' + dims;
  buildGround();
  if(!data.glb){
    if((data.lot?.fence)==='perimeter') buildFence();
    (data.paths||[]).forEach(addPath);
    (data.vacantSlots||[]).forEach(addVacant);
    (data.structures||[]).forEach(s=>{
      if(s.type==='building') addBuilding(s);
      else if(s.type==='court') addCourt(s);
      else if(s.type==='pool') addPool(s);
    });
    (data.trees||[]).forEach(t=>addTree(t.x,t.z));
  }
  // legend
  let items;
  if(data.glb){
    items = `<div class="li">• Engineer's model</div><div class="li" style="opacity:.7">${data.glb}</div>`;
  } else {
    items = (data.structures||[]).map(s=>`<div class="li">• ${s.label||s.id}</div>`).join('')
      + (data.vacantSlots||[]).map(s=>`<div class="li" style="color:#ffe9bf">▢ ${s.label||s.id}</div>`).join('');
  }
  document.getElementById('legend').innerHTML = `<b>${data.meta?.name||'Lot'}</b>${items}`;
  return data;
}

/* ---------- controllers ---------- */
let mode='walk', walking=false, yaw=0, pitch=-0.05;
const keys={}, mv={x:0,y:0}, lk={x:0,y:0};
addEventListener('keydown',e=>{keys[e.code]=true; if(e.code==='KeyV') toggleMode();});
addEventListener('keyup',e=>{keys[e.code]=false;});
const canvas=renderer.domElement;
const orbit=new OrbitControls(camera, renderer.domElement); orbit.enabled=false; orbit.enableDamping=true;
orbit.maxPolarAngle=Math.PI*0.49;

function spawnWalk(){ camera.position.set(0,EYE,LOT.depth/2-4); yaw=0; pitch=-0.05; }
function spawnOrbit(){ orbit.target.set(0,0,0); camera.position.set(0, Math.max(LOT.width,LOT.depth)*0.9, LOT.depth*0.75); orbit.update(); }

function setMode(m){
  mode=m;
  document.getElementById('walkBtn').classList.toggle('active', m==='walk');
  document.getElementById('planBtn').classList.toggle('active', m==='plan');
  document.getElementById('crosshair').style.display = (m==='walk'&&walking)?'block':'none';
  document.body.classList.toggle('walking', m==='walk'&&walking);
  document.getElementById('hint').textContent = m==='walk' ? 'WASD move · mouse look · Shift run · V = top view' : 'drag to orbit · scroll to zoom · V = walk';
  if(m==='plan'){ orbit.enabled=true; spawnOrbit(); if(document.pointerLockElement) document.exitPointerLock(); }
  else { orbit.enabled=false; spawnWalk(); if(!isTouch) canvas.requestPointerLock?.(); }
}
function toggleMode(){ if(!walking) return; setMode(mode==='walk'?'plan':'walk'); }

document.getElementById('walkBtn').onclick=()=>setMode('walk');
document.getElementById('planBtn').onclick=()=>setMode('plan');
document.getElementById('exitBtn').onclick=stopAll;
document.getElementById('startBtn').onclick=start;

function start(){
  overlay.classList.add('hidden');
  document.getElementById('topbar').style.display='flex';
  document.getElementById('hint').style.display='block';
  walking=true; setMode('walk');
}
function stopAll(){
  overlay.classList.remove('hidden');
  document.getElementById('topbar').style.display='none';
  document.getElementById('hint').style.display='none';
  document.getElementById('crosshair').style.display='none';
  document.body.classList.remove('walking');
  walking=false; orbit.enabled=false;
  if(document.pointerLockElement) document.exitPointerLock();
}
document.addEventListener('pointerlockchange',()=>{ if(!document.pointerLockElement && walking && mode==='walk' && !isTouch){ /* user can re-enter by clicking */ } });
const SENS=0.0024;
addEventListener('mousemove',e=>{ if(!walking||mode!=='walk'||isTouch) return; if(document.pointerLockElement!==canvas) return;
  yaw-=e.movementX*SENS; pitch=Math.max(-1.45,Math.min(1.45,pitch-e.movementY*SENS)); });
canvas.addEventListener('click',()=>{ if(walking&&mode==='walk'&&!isTouch&&document.pointerLockElement!==canvas) canvas.requestPointerLock?.(); });

/* touch sticks */
function bindStick(el,out){ const knob=el.querySelector('.knob'); let id=null,cx=0,cy=0,R=54;
  el.addEventListener('touchstart',e=>{const t=e.changedTouches[0];id=t.identifier;const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;e.preventDefault();},{passive:false});
  el.addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier!==id)continue;let dx=t.clientX-cx,dy=t.clientY-cy;const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d;}knob.style.transform=`translate(${dx}px,${dy}px)`;out.x=dx/R;out.y=dy/R;}e.preventDefault();},{passive:false});
  const end=e=>{for(const t of e.changedTouches){if(t.identifier===id){id=null;out.x=0;out.y=0;knob.style.transform='translate(0,0)';}}};
  el.addEventListener('touchend',end);el.addEventListener('touchcancel',end); }
bindStick(document.getElementById('stickMove'),mv);
bindStick(document.getElementById('stickLook'),lk);

function blocked(x,z){ if(x<-LOT.width/2+0.5||x>LOT.width/2-0.5)return true; if(z<-LOT.depth/2+0.5||z>LOT.depth/2-0.5)return true;
  for(const c of colliders){ if(x>c.minX&&x<c.maxX&&z>c.minZ&&z<c.maxZ) return true; } return false; }

const WALK=5, RUN=9.5, clock=new THREE.Clock();
function tick(){
  const dt=Math.min(clock.getDelta(),0.05);
  if(mode==='walk'){
    if(isTouch&&(lk.x||lk.y)){ yaw-=lk.x*2.2*dt; pitch=Math.max(-1.45,Math.min(1.45,pitch-lk.y*1.8*dt)); }
    camera.rotation.y=yaw; camera.rotation.x=pitch;
    if(walking){
      let fwd=0,str=0;
      if(keys['KeyW']||keys['ArrowUp'])fwd+=1; if(keys['KeyS']||keys['ArrowDown'])fwd-=1;
      if(keys['KeyD']||keys['ArrowRight'])str+=1; if(keys['KeyA']||keys['ArrowLeft'])str-=1;
      if(isTouch){fwd+=-mv.y;str+=mv.x;}
      const L=Math.hypot(fwd,str)||1; fwd/=L; str/=L;
      const sp=(keys['ShiftLeft']||keys['ShiftRight'])?RUN:WALK, sy=Math.sin(yaw), cy=Math.cos(yaw);
      const nx=camera.position.x+(str*cy-fwd*sy)*sp*dt, nz=camera.position.z+(str*sy+fwd*cy)*sp*dt;
      if(!blocked(nx,camera.position.z))camera.position.x=nx;
      if(!blocked(camera.position.x,nz))camera.position.z=nz;
      if(keys['KeyE'])camera.position.y+=4*dt; if(keys['KeyQ'])camera.position.y-=4*dt;
      camera.position.y=Math.max(EYE,Math.min(60,camera.position.y));
    }
  } else { orbit.update(); }
  renderer.render(scene,camera); labelRenderer.render(scene,camera);
  requestAnimationFrame(tick);
}
window.viewer = { get renderer(){return renderer;}, get scene(){return scene;}, get camera(){return camera;}, get orbit(){return orbit;} };
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); labelRenderer.setSize(innerWidth,innerHeight); });

loadScene().then(()=>{ spawnWalk(); tick(); }).catch(e=>{
  document.getElementById('scnName').textContent='Error loading scene.json: '+e.message;
});
