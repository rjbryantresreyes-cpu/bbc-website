# Netlify config for bbc-website
# Static site + serverless functions (secure backend for the /os dashboard).

[build]
  # Cost control: SKIP the rebuild ONLY for the automated dashboard data-refresh
  # commits (the /os sync runs up to ~10x/day; redeploying each one burned the
  # whole Netlify credit budget, 199 deploys/9 days). Those commits always use the
  # exact message below. EVERY other commit builds normally, including manual
  # dashboard edits (icons, archived tabs) and the once-daily 6am sync (which uses
  # a different commit message), so real changes always go live.
  # Exit 0 = skip build, exit 1 = build.
  # (Earlier this was path-based on os/, but that wrongly skipped legitimate manual
  # dashboard code changes too. Message-based is precise.)
  ignore = "test \"$(git log -1 --pretty=%s)\" = 'Dashboard sync: refresh /os data from system'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Social media posted to Metricool references the ARTICLE slug, but the media was
# published under its wf-numbered folder name. The URLs 404'd, so 23 scheduled posts
# failed to publish on 2026-09-04 across Facebook, Instagram, TikTok and YouTube while
# the calendar still looked full. These rewrites point the article slug at the media
# that already exists. Each pair was confirmed by matching the scheduled post's text to
# that folder's caption.md, not by guessing from the folder name.
# The real fix is for the content pipeline to publish under one naming scheme; until
# then, add a line here whenever a post is scheduled against an article slug.
[[redirects]]
  from = "/social-media/can-my-ai-see-my-screen-and-help/*"
  to = "/social-media/wf30-ai-sees-your-screen/:splat"
  status = 200

[[redirects]]
  from = "/social-media/how-to-make-branded-proposals-quotes-fast/*"
  to = "/social-media/wf32-branded-proposals-fast/:splat"
  status = 200

[[redirects]]
  from = "/social-media/how-to-read-text-from-scanned-documents/*"
  to = "/social-media/wf31-read-scanned-docs/:splat"
  status = 200

[[redirects]]
  from = "/social-media/how-we-clone-website-without-installing-anything/*"
  to = "/social-media/wf28-website-replicator/:splat"
  status = 200

[[redirects]]
  from = "/social-media/how-we-document-every-process-as-content/*"
  to = "/social-media/wf29-process-as-content/:splat"
  status = 200

[[redirects]]
  from = "/social-media/remove-discontinued-products-from-website/*"
  to = "/social-media/wf108-remove-discontinued-products-from-website/:splat"
  status = 200

# Serve PWA manifests with the correct MIME type so the dashboards install on Android too.
[[headers]]
  for = "/wwos/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/os/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sros/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/cros/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# --------------------------------------------------------------------------
# Internal files must not be served. There is no `publish` directory set, so
# Netlify serves the repo root, which means every internal .md and tool in here
# is fetchable on the live domain. Confirmed 2026-09-05: fetching
# https://balaynibruno.co/_PENDING_PUSH.md returned the real file, exposing
# client names, which clients had churned, and internal C:\ and G:\ paths.
# These rules 404 the internal paths. force = true so they win over the real file.
# --------------------------------------------------------------------------
[[redirects]]
  from = "/_PENDING_PUSH.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/case-studies.DRAFT-NOTES.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.impeccable/*"
  to = "/404.html"
  status = 404
  force = true
