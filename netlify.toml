# Netlify config for bbc-website
# Static site + serverless functions (secure backend for the /os dashboard).

[build]
  # Cost control: SKIP the rebuild when a commit changes ONLY the /os dashboard
  # data files (os/index.html, os-preview/index.html). Those are regenerated by
  # the dashboard sync up to ~10x/day; redeploying each one burned the whole
  # Netlify credit budget (199 deploys/9 days). The marketing site and functions
  # still deploy normally because those commits touch files outside os/.
  # Exit 0 = skip build, exit 1 = build. git diff exits 0 (skip) only when there
  # are NO changes outside os/ and os-preview/. Empty CACHED_COMMIT_REF -> errors
  # nonzero -> builds (safe default). Permanent fix tracked separately: serve the
  # dashboard data live so /os never needs a redeploy.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)os/' ':(exclude)os-preview/'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
