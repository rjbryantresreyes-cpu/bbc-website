# Netlify config for bbc-website
# Static site + serverless functions (secure backend for the /os dashboard).

[build]
  # Cost control: SKIP the rebuild ONLY for the automated dashboard data-refresh
  # commits (the /os sync runs up to ~10x/day; redeploying each one burned the
  # whole Netlify credit budget, 199 deploys/9 days). Those commits always use the
  # exact message below. EVERY other commit builds normally, including manual
  # dashboard edits (icons, archived tabs) and the once-daily 6am sync (which uses
  # a different commit message), so real changes always go live.
  # Exit 0 = skip build, exit 1 = build.
  # (Earlier this was path-based on os/, but that wrongly skipped legitimate manual
  # dashboard code changes too. Message-based is precise.)
  ignore = "test \"$(git log -1 --pretty=%s)\" = 'Dashboard sync: refresh /os data from system'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Serve PWA manifests with the correct MIME type so the dashboards install on Android too.
[[headers]]
  for = "/wwos/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/os/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sros/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/cros/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# --------------------------------------------------------------------------
# Internal files must not be served. There is no `publish` directory set, so
# Netlify serves the repo root, which means every internal .md and tool in here
# is fetchable on the live domain. Confirmed 2026-09-05: fetching
# https://balaynibruno.co/_PENDING_PUSH.md returned the real file, exposing
# client names, which clients had churned, and internal C:\ and G:\ paths.
# These rules 404 the internal paths. force = true so they win over the real file.
# --------------------------------------------------------------------------
[[redirects]]
  from = "/_PENDING_PUSH.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/case-studies.DRAFT-NOTES.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.impeccable/*"
  to = "/404.html"
  status = 404
  force = true

