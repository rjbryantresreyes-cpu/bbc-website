*{box-sizing:border-box}
html,body{height:100%}

  display:block; width:min(92vw, 460px); line-height:0; border-radius:10px; overflow:hidden;

a.card:hover{ transform:translateY(-3px); box-shadow:0 30px 70px -18px rgba(20,20,10,.6); }
a.card:active{ transform:scale(.99); }
a.card img{ display:block; width:100%; height:auto; }
