<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27406A"/>
      <stop offset="1" stop-color="#16263F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4A84B"/>
      <stop offset="1" stop-color="#B8923E"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="180" r="520" fill="#B8923E" opacity="0.06"/>
  <!-- incoming bubble -->
  <g>
    <rect x="300" y="300" rx="26" ry="26" width="520" height="120" fill="#ffffff" opacity="0.96"/>
    <rect x="330" y="338" width="360" height="16" rx="8" fill="#27406A" opacity="0.85"/>
    <rect x="330" y="372" width="240" height="16" rx="8" fill="#27406A" opacity="0.45"/>
  </g>
  <!-- outgoing bubble with seen ticks -->
  <g>
    <rect x="640" y="470" rx="26" ry="26" width="560" height="120" fill="url(#gold)"/>
    <rect x="672" y="508" width="300" height="16" rx="8" fill="#1A1206" opacity="0.8"/>
    <rect x="672" y="542" width="200" height="16" rx="8" fill="#1A1206" opacity="0.5"/>
    <path d="M1110 556 l14 14 l26 -30 M1132 556 l14 14 l26 -30" fill="none" stroke="#34A3FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Messy robot avatar -->
  <g transform="translate(1140 250)">
    <circle cx="0" cy="0" r="92" fill="#1F3557" stroke="url(#gold)" stroke-width="6"/>
    <rect x="-46" y="-34" width="92" height="74" rx="20" fill="#F3E4B8"/>
    <circle cx="-18" cy="2" r="11" fill="#27406A"/>
    <circle cx="18" cy="2" r="11" fill="#27406A"/>
    <rect x="-22" y="24" width="44" height="8" rx="4" fill="#27406A" opacity="0.7"/>
    <line x1="0" y1="-34" x2="0" y2="-58" stroke="url(#gold)" stroke-width="6"/>
    <circle cx="0" cy="-64" r="8" fill="url(#gold)"/>
  </g>
  <text x="300" y="690" font-family="Playfair Display, Georgia, serif" font-size="62" font-weight="700" fill="#ffffff">One team. One app.</text>
  <text x="300" y="762" font-family="Playfair Display, Georgia, serif" font-size="62" font-weight="700" fill="#E6CFA0">Every chat, file, and an AI helper.</text>
</svg>
